<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>行测计时器</title>
<style>
  /* ================================================================
   * 设计系统 · 浅色主题(默认)
   * ================================================================ */
  :root {
    --bg: #f7f7f4;
    --card: #ffffff;
    --text: #18181b;
    --text-2: #6f6f76;
    --text-3: #a4a4ab;
    --border: #e7e7e3;
    --border-soft: #f0f0ec;
    --hover: #fafaf8;

    --accent: #4f46e5;
    --accent-rgb: 79,70,229;
    --accent-ink: #4338ca;
    --accent-soft: rgba(var(--accent-rgb), .12);
    --accent-glow: rgba(var(--accent-rgb), .16);

    --ok: #059669;   --ok-rgb: 5,150,105;   --ok-soft: #ecfdf5;
    --warn: #d97706; --warn-rgb: 217,119,6; --warn-soft: #fffbeb;
    --bad: #dc2626;  --bad-rgb: 220,38,38;  --bad-soft: #fef2f2;

    --heat-empty: #eeece8;
    --toast-bg: #18181b;
    --toast-text: #ffffff;

    --radius: 18px;
    --radius-sm: 11px;
    --shadow: 0 1px 2px rgba(24,24,27,.04), 0 10px 32px rgba(24,24,27,.055);
    --shadow-lift: 0 2px 6px rgba(24,24,27,.06), 0 18px 44px rgba(24,24,27,.1);
    --shadow-pop: 0 4px 14px rgba(24,24,27,.08), 0 24px 56px rgba(24,24,27,.16);

    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  }

  /* ================================================================
   * 深色主题
   * ================================================================ */
  html[data-theme="dark"] {
    --bg: #0f0f13;
    --card: #17171d;
    --text: #f2f2f5;
    --text-2: #a2a2ac;
    --text-3: #6e6e79;
    --border: #26262e;
    --border-soft: #1f1f27;
    --hover: #1d1d25;

    --ok: #34d399;   --ok-soft: rgba(52,211,153,.12);
    --warn: #fbbf24; --warn-soft: rgba(251,191,36,.12);
    --bad: #f87171;  --bad-soft: rgba(248,113,113,.12);

    --heat-empty: #1e1e26;
    --toast-bg: #26262e;
    --toast-text: #f2f2f5;

    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 32px rgba(0,0,0,.35);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.35), 0 18px 44px rgba(0,0,0,.5);
    --shadow-pop: 0 4px 14px rgba(0,0,0,.4), 0 24px 56px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  html { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }

  body {
    font-family: var(--font);
    background: transparent;
    color: var(--text);
    line-height: 1.55;
    padding-bottom: 56px;
    -webkit-font-smoothing: antialiased;
    position: relative;
    min-height: 100vh;
    transition: color .25s;
  }

  /* ===== 环境光斑(跟随考试主题色) ===== */
  body::before, body::after {
    content: ''; position: fixed; pointer-events: none; z-index: 0;
    border-radius: 50%;
  }
  body::before {
    width: 62vw; height: 62vw; top: -28vw; right: -20vw;
    background: radial-gradient(circle, rgba(var(--accent-rgb), .085) 0%, transparent 62%);
  }
  body::after {
    width: 54vw; height: 54vw; bottom: -26vw; left: -18vw;
    background: radial-gradient(circle, rgba(var(--accent-rgb), .055) 0%, transparent 60%);
  }
  html[data-theme="dark"] body::before { background: radial-gradient(circle, rgba(var(--accent-rgb), .12) 0%, transparent 62%); }
  html[data-theme="dark"] body::after  { background: radial-gradient(circle, rgba(var(--accent-rgb), .08) 0%, transparent 60%); }

  .wrap { max-width: 880px; margin: 0 auto; padding: 0 22px; position: relative; z-index: 1; }

  /* ================================================================
   * 顶部栏
   * ================================================================ */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(247,247,244,.84);
    backdrop-filter: saturate(180%) blur(18px);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    border-bottom: 1px solid var(--border-soft);
    transition: background .25s, border-color .25s;
  }
  html[data-theme="dark"] .topbar { background: rgba(15,15,19,.8); }
  .topbar-inner {
    max-width: 880px; margin: 0 auto; padding: 11px 22px;
    display: flex; align-items: center; gap: 9px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 650; letter-spacing: -.01em;
    cursor: pointer; white-space: nowrap; color: var(--text);
    transition: opacity .15s;
  }
  .brand:hover { opacity: .82; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-mark svg { width: 16px; height: 16px; }
  .topbar .spacer { flex: 1; }

  /* 考试切换 */
  .exam-switch { position: relative; flex-shrink: 0; }
  .exam-switch-btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    height: 34px; padding: 0 12px 0 10px; border-radius: 999px; font-size: 13px; cursor: pointer;
    font-family: var(--font); font-weight: 570; transition: all .16s; white-space: nowrap;
    max-width: 168px;
  }
  .exam-switch-btn:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .exam-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex-shrink: 0;
    box-shadow: 0 0 0 3px var(--accent-soft); }
  .exam-switch-btn .nm { overflow: hidden; text-overflow: ellipsis; }
  .exam-switch-btn .arrow { font-size: 9px; color: var(--text-3); display: inline-flex; }
  .exam-switch-btn .arrow svg { width: 12px; height: 12px; }
  .exam-dropdown {
    position: absolute; top: 100%; right: 0; margin-top: 7px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow-pop); min-width: 200px; overflow: hidden;
    display: none; z-index: 60; padding: 5px;
    transform-origin: top right;
  }
  .exam-dropdown.show { display: block; animation: popIn .18s cubic-bezier(.2,.9,.3,1.2); }
  .exam-dropdown .item {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 11px; font-size: 13.5px; cursor: pointer; transition: background .12s;
    border: none; background: none; width: 100%; text-align: left;
    font-family: var(--font); color: var(--text); border-radius: 9px; font-weight: 520;
  }
  .exam-dropdown .item:hover { background: var(--hover); }
  .exam-dropdown .item.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 620; }
  .exam-dropdown .item .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .exam-dropdown .item .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exam-dropdown .item .check { color: var(--accent); display: inline-flex; }
  .exam-dropdown .item .check svg { width: 14px; height: 14px; }
  .exam-dropdown .divider { height: 1px; background: var(--border-soft); margin: 5px 8px; }
  .exam-dropdown .item.add { color: var(--accent); font-weight: 570; }

  .today-pill {
    font-size: 12px; color: var(--text-2);
    background: var(--card); border: 1px solid var(--border);
    padding: 6px 13px; border-radius: 999px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .tbtn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: var(--card); color: var(--text-2);
    height: 34px; padding: 0 13px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
    transition: all .16s; font-family: var(--font); font-weight: 530; white-space: nowrap;
  }
  .tbtn svg { width: 15px; height: 15px; }
  .tbtn:hover { border-color: var(--text-3); color: var(--text); background: var(--hover); }
  .tbtn.icon-only { padding: 0 9px; }

  @media (max-width: 620px) {
    .topbar-inner { padding: 9px 12px; gap: 6px; }
    .today-pill { display: none; }
    .tbtn { padding: 0 9px; }
    .tbtn .lb { display: none; }
    .exam-switch-btn { max-width: 118px; padding: 0 9px 0 8px; font-size: 12px; }
    .brand .bt { display: none; }
  }

  /* ================================================================
   * 通用组件
   * ================================================================ */
  h1 { font-size: 26px; font-weight: 680; letter-spacing: -.022em; }
  .muted { color: var(--text-2); }
  .muted-3 { color: var(--text-3); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    transition: background .25s, border-color .25s;
  }
  .card-pad { padding: 26px; }
  .section-title {
    font-size: 12.5px; font-weight: 620; color: var(--text-2);
    letter-spacing: .05em; display: flex; align-items: center; gap: 7px;
  }
  .section-title svg { width: 14px; height: 14px; color: var(--accent); flex-shrink: 0; }
  .row { display: flex; align-items: center; gap: 10px; }
  .gap-8 { gap: 8px; }
  .mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; } .mt-32 { margin-top: 32px; }
  .mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }

  button { font-family: var(--font); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    height: 45px; padding: 0 22px; border-radius: 13px; font-size: 15px; cursor: pointer;
    transition: all .17s; font-weight: 560;
  }
  .btn:hover { border-color: var(--text-3); background: var(--hover); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 1px 2px rgba(var(--accent-rgb), .35), 0 8px 22px rgba(var(--accent-rgb), .28);
  }
  .btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); transform: translateY(-1px);
    box-shadow: 0 2px 5px rgba(var(--accent-rgb), .4), 0 12px 28px rgba(var(--accent-rgb), .34); }
  .btn-primary:active { transform: translateY(0); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
  .btn-ghost:hover { color: var(--text); background: var(--border-soft); }
  .btn-danger { color: var(--bad); }
  .btn-danger:hover { border-color: rgba(var(--bad-rgb), .4); background: var(--bad-soft); }
  .btn-sm { height: 34px; padding: 0 15px; font-size: 13px; border-radius: 10px; }
  .btn-block { width: 100%; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 560;
  }
  .pill-ok { background: var(--ok-soft); color: var(--ok); }
  .pill-warn { background: var(--warn-soft); color: var(--warn); }
  .pill-bad { background: var(--bad-soft); color: var(--bad); }
  .pill-gray { background: var(--border-soft); color: var(--text-2); }
  .pill-accent { background: var(--accent-soft); color: var(--accent-ink); }

  /* ================================================================
   * 首页
   * ================================================================ */
  .hero { padding: 44px 0 10px; }
  .hero-eyebrow {
    font-size: 10.5px; font-weight: 680; letter-spacing: .22em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 10px;
    display: flex; align-items: center; gap: 7px;
  }
  .hero-eyebrow::before {
    content: ''; width: 18px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }
  .hero h1 {
    font-size: 33px; font-weight: 720; letter-spacing: -.03em; line-height: 1.22; text-wrap: balance;
    background: linear-gradient(115deg, var(--text) 55%, var(--accent));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: var(--text);
  }
  .hero .sub { color: var(--text-2); font-size: 14.5px; margin-top: 8px; }

  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .mode-grid { grid-template-columns: 1fr; } }
  .mode-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 24px; cursor: pointer; transition: all .2s cubic-bezier(.2,.8,.3,1);
    display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
  }
  .mode-card::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(420px 160px at 85% -20%, var(--accent-glow), transparent 70%);
    opacity: 0; transition: opacity .25s;
  }
  .mode-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: rgba(var(--accent-rgb), .45); }
  .mode-card:hover::after { opacity: 1; }
  .mode-card .app-ico {
    width: 42px; height: 42px; border-radius: 13px;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .mode-card .app-ico svg { width: 21px; height: 21px; }
  .mode-card .t { font-size: 17.5px; font-weight: 660; letter-spacing: -.012em; }
  .mode-card .d { font-size: 12.5px; color: var(--text-2); line-height: 1.5; }

  /* ===== 今日计划卡 ===== */
  .plan-card { --plan-x: 26px; padding: 0; overflow: hidden; }
  .plan-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; padding: 24px var(--plan-x) 0;
  }
  .plan-eyebrow {
    font-size: 10.5px; font-weight: 680; letter-spacing: .15em;
    color: var(--text-3); text-transform: uppercase; font-variant-numeric: tabular-nums;
  }
  .plan-title { font-size: 19px; font-weight: 690; letter-spacing: -.015em; margin-top: 5px; }
  .exam-chip {
    display: inline-flex; align-items: baseline; gap: 4px; flex-shrink: 0;
    background: var(--accent-soft); color: var(--accent-ink);
    border-radius: 999px; padding: 7px 14px; font-size: 12px; white-space: nowrap;
  }
  .exam-chip b {
    font-family: var(--mono); font-size: 17px; font-weight: 600;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  }
  .exam-chip.dim { background: var(--border-soft); color: var(--text-3); }
  .exam-chip.hot { background: var(--warn-soft); color: var(--warn); }
  .plan-progress { display: flex; align-items: center; gap: 12px; padding: 16px var(--plan-x) 0; }
  .plan-bar { flex: 1; height: 5px; border-radius: 99px; background: var(--border-soft); overflow: hidden; }
  .plan-bar i {
    display: block; height: 100%; border-radius: inherit;
    background: linear-gradient(90deg, rgba(var(--accent-rgb), .55), var(--accent));
    transition: width .45s cubic-bezier(.4,0,.2,1);
  }
  .plan-progress-text { font-size: 11.5px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .plan-progress.all-done .plan-bar i { background: var(--ok); }
  .plan-progress.all-done .plan-progress-text { color: var(--ok); font-weight: 560; }
  .plan-list { display: flex; flex-direction: column; gap: 8px; margin: 14px var(--plan-x) 0; }
  .plan-item {
    display: flex; align-items: center; gap: 11px; padding: 10px 13px;
    border: 1px solid transparent; border-radius: 12px; background: var(--hover);
    transition: background .15s, border-color .15s;
  }
  .plan-item:hover { background: var(--border-soft); }
  .plan-item:focus-within { background: var(--card); border-color: var(--border); }
  .plan-item.done { background: var(--ok-soft); }
  .plan-check {
    width: 21px; height: 21px; border-radius: 50%; border: 1.5px solid var(--text-3);
    background: var(--card); color: #fff; font-size: 11px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; padding: 0;
    transition: all .18s;
  }
  .plan-check:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .plan-item.done .plan-check { background: var(--ok); border-color: var(--ok); }
  input.plan-text {
    flex: 1; min-width: 0; height: auto; padding: 0; border: none; background: transparent;
    font-size: 14px; color: var(--text); box-shadow: none; outline: none;
  }
  input.plan-text:focus { border: none; box-shadow: none; }
  .plan-item.done input.plan-text { color: var(--text-3); text-decoration: line-through; }
  .plan-del {
    width: 24px; height: 24px; border: none; border-radius: 50%; background: transparent;
    color: var(--text-3); font-size: 15px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: all .15s; flex-shrink: 0;
  }
  .plan-item:hover .plan-del { opacity: 1; }
  .plan-del:hover { background: var(--bad-soft); color: var(--bad); }
  @media (max-width: 560px) { .plan-del { opacity: .55; } }
  .plan-empty { padding: 32px var(--plan-x) 22px; text-align: center; }
  .plan-empty b { display: block; font-size: 13.5px; font-weight: 560; color: var(--text-2); }
  .plan-empty span { display: block; margin-top: 4px; font-size: 12px; color: var(--text-3); }
  .plan-add {
    display: flex; align-items: center; gap: 8px; margin: 12px var(--plan-x) 0;
    padding: 4px 4px 4px 14px; border: 1px solid transparent; border-radius: 12px;
    background: var(--border-soft); transition: all .15s;
  }
  .plan-add:focus-within { background: var(--card); border-color: var(--border); }
  .plan-add-icon { color: var(--text-3); font-size: 15px; line-height: 1; }
  input.plan-new {
    flex: 1; min-width: 0; height: 34px; padding: 0; border: none;
    background: transparent; box-shadow: none; font-size: 13px; color: var(--text);
  }
  input.plan-new:focus { border: none; box-shadow: none; }
  .plan-add-btn {
    height: 30px; padding: 0 14px; border: none; border-radius: 9px;
    background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 560;
    cursor: pointer; transition: background .15s; flex-shrink: 0;
  }
  .plan-add-btn:hover { background: var(--accent-ink); }
  .plan-suggest {
    display: flex; align-items: center; gap: 8px; margin: 10px var(--plan-x) 0;
    padding: 9px 10px 9px 13px; border: 1px dashed var(--border);
    border-radius: 12px; background: var(--card); font-size: 12px; color: var(--text-2);
  }
  .sug-tag {
    flex-shrink: 0; font-size: 10.5px; font-weight: 620; color: var(--accent-ink);
    background: var(--accent-soft); border-radius: 6px; padding: 2px 7px;
  }
  .sug-text { flex: 1; min-width: 0; }
  .sug-add {
    flex-shrink: 0; height: 27px; padding: 0 11px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card); color: var(--text); font-size: 12px;
    cursor: pointer; transition: all .15s;
  }
  .sug-add:hover { border-color: var(--accent); color: var(--accent-ink); }
  .week-strip {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    margin: 20px var(--plan-x) 0; padding-top: 17px; border-top: 1px solid var(--border-soft);
  }
  .week-day { text-align: center; padding: 2px 0; }
  .week-day .wd-label { display: block; font-size: 10.5px; color: var(--text-3); margin-bottom: 7px; }
  .week-day .wd-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--heat-empty); }
  .week-day.done .wd-dot { background: var(--accent); box-shadow: 0 0 8px rgba(var(--accent-rgb), .55); }
  .week-day.today .wd-label { color: var(--accent-ink); font-weight: 660; }
  .week-day.today:not(.done) .wd-dot {
    background: var(--card); border: 1.5px solid var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .week-day.today.done .wd-dot { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 8px rgba(var(--accent-rgb), .55); }
  .week-day.future { opacity: .4; }
  .plan-foot {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
    margin: 17px var(--plan-x) 0; padding: 15px 0 22px;
    font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums;
  }
  @media (max-width: 560px) { .plan-card { --plan-x: 18px; } }

  /* ===== 诊断表 ===== */
  table.diag { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.diag th, table.diag td { text-align: left; padding: 12px 11px; border-bottom: 1px solid var(--border-soft); }
  table.diag th { color: var(--text-3); font-weight: 520; font-size: 11.5px; white-space: nowrap; letter-spacing: .03em; }
  table.diag td.num, table.diag th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.diag tr:last-child td { border-bottom: none; }
  table.diag tbody tr { cursor: pointer; transition: background .12s; }
  table.diag tbody tr:hover { background: var(--hover); }
  table.diag tbody tr.sel { background: var(--accent-soft); }

  /* ===== 折线图 ===== */
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 560px) { .chart-row { grid-template-columns: 1fr; } }
  .chart-box svg { display: block; width: 100%; height: auto; }
  .spark-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .spark-title { font-size: 13px; font-weight: 610; color: var(--text-2); letter-spacing: .01em; }
  .spark-hint { font-size: 11px; font-weight: 500; color: var(--text-3); margin-left: 6px; }
  .spark-cur { font-size: 15.5px; font-weight: 660; font-variant-numeric: tabular-nums; }
  .spark-unit { font-size: 11px; font-weight: 500; color: var(--text-3); margin-left: 2px; }

  /* ================================================================
   * 计时器(沉浸式舞台)
   * ================================================================ */
  .timer-stage {
    position: relative; text-align: center;
    padding: 44px 0 10px; display: flex; flex-direction: column; align-items: center;
  }
  .timer-glow {
    position: absolute; top: 46%; left: 50%;
    width: min(520px, 130vw); height: min(520px, 130vw);
    transform: translate(-50%, -52%);
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle,
      rgba(var(--accent-rgb), .17) 0%,
      rgba(var(--accent-rgb), .055) 40%,
      transparent 68%);
    filter: blur(8px);
    animation: glowPulse 5.2s ease-in-out infinite;
    transition: background .4s;
  }
  .timer-glow.over {
    background: radial-gradient(circle,
      rgba(var(--bad-rgb), .2) 0%,
      rgba(var(--bad-rgb), .06) 40%,
      transparent 68%);
    animation: glowPulse 1.7s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: .72; transform: translate(-50%, -52%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -52%) scale(1.045); }
  }
  .timer-chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--accent-soft); color: var(--accent-ink);
    padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 570;
    position: relative;
  }
  .timer-num {
    font-family: var(--mono); font-weight: 150; letter-spacing: -.025em;
    font-size: clamp(58px, 17vw, 140px); line-height: 1.06;
    font-variant-numeric: tabular-nums; color: var(--text);
    margin: 18px 0 6px; transition: color .35s; position: relative;
    text-shadow: 0 0 60px rgba(var(--accent-rgb), .14);
  }
  .timer-num.overdue { color: var(--bad); text-shadow: 0 0 60px rgba(var(--bad-rgb), .2); animation: blink 1s steps(2,start) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .timer-meta { color: var(--text-3); font-size: 13px; position: relative; }
  .timer-meta b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .progress { height: 5px; background: var(--border-soft); border-radius: 999px; overflow: hidden; margin-top: 24px; width: 100%; max-width: 460px; position: relative; }
  .progress > i {
    display: block; height: 100%; border-radius: inherit;
    background: linear-gradient(90deg, rgba(var(--accent-rgb), .6), var(--accent));
    transition: width .3s; box-shadow: 0 0 12px rgba(var(--accent-rgb), .5);
  }
  .progress > i.over { background: var(--bad); box-shadow: 0 0 12px rgba(var(--bad-rgb), .5); }

  .timer-btns { display: flex; gap: 12px; justify-content: center; margin-top: 36px; position: relative; flex-wrap: wrap; }
  .timer-btns .btn { min-width: 130px; }

  .seg-panel { position: relative; }
  .seg-list { display: flex; flex-direction: column; gap: 7px; }
  .seg-item {
    display: flex; align-items: center; gap: 11px; padding: 11px 15px;
    border: 1px solid var(--border); border-radius: 13px; font-size: 14px;
    background: var(--card); transition: all .18s; cursor: pointer;
  }
  .seg-item:hover { border-color: var(--text-3); }
  .seg-item.cur { border-color: rgba(var(--accent-rgb), .55); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); }
  .seg-item.done { color: var(--text-3); background: transparent; }
  .seg-item .gi {
    width: 22px; height: 22px; border-radius: 50%; background: var(--border-soft);
    display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-2); flex-shrink: 0;
  }
  .seg-item.done .gi { background: var(--ok); color: #fff; }
  .seg-item.cur .gi { background: var(--accent); color: #fff; box-shadow: 0 0 10px rgba(var(--accent-rgb), .5); }
  .seg-item .nm { flex: 1; }
  .seg-item .tm { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 13px; color: var(--text-2); }
  .seg-item.cur .tm { color: var(--accent-ink); }

  /* ================================================================
   * 表单
   * ================================================================ */
  label.fl { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 7px; font-weight: 560; }
  input[type=number], input[type=text], input[type=date], select {
    width: 100%; height: 45px; padding: 0 15px; border: 1px solid var(--border);
    border-radius: 13px; font-size: 15px; font-family: var(--font); color: var(--text);
    background: var(--card); transition: border-color .16s, box-shadow .16s; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent-soft); }
  input[type=number] { font-variant-numeric: tabular-nums; }
  input[type=color] {
    width: 46px; height: 36px; padding: 3px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--card); cursor: pointer;
  }
  input[type=color]:hover { border-color: var(--accent); }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 7px; }

  .opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); gap: 10px; }
  .opt {
    border: 1px solid var(--border); border-radius: 13px; padding: 14px; cursor: pointer;
    transition: all .15s; background: var(--card); text-align: left; position: relative;
  }
  .opt:hover { border-color: var(--text-3); transform: translateY(-1px); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); }
  .opt .t { font-size: 14px; font-weight: 610; }
  .opt .s { font-size: 12px; color: var(--text-2); margin-top: 3px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border); background: var(--card); border-radius: 999px;
    padding: 6px 15px; font-size: 13px; cursor: pointer; transition: all .15s; color: var(--text-2);
  }
  .chip:hover { border-color: var(--text-3); color: var(--text); }
  .chip.sel { border-color: var(--accent); background: var(--accent); color: #fff; box-shadow: 0 3px 10px rgba(var(--accent-rgb), .35); }

  .seg-input { display: grid; grid-template-columns: 1fr 96px 96px 44px; gap: 8px; align-items: center; }
  @media (max-width: 560px) { .seg-input { grid-template-columns: 1fr 82px 44px; } .seg-input .hide-sm { display: none; } }
  .drag-btn {
    border: none; background: transparent; color: var(--text-3); cursor: grab; font-size: 16px; padding: 4px;
    width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center;
    transition: all .14s;
  }
  .drag-btn:hover { color: var(--text); background: var(--border-soft); }
  .drag-btn.del:hover { color: var(--bad); background: var(--bad-soft); }

  .empty { text-align: center; padding: 44px 20px; color: var(--text-3); font-size: 14px; }

  /* ===== 完成页 ===== */
  .result-big { text-align: center; padding: 10px 0; }
  .result-big .val {
    font-family: var(--mono); font-size: 42px; font-weight: 250; font-variant-numeric: tabular-nums;
    background: linear-gradient(115deg, var(--text) 50%, var(--accent));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .result-big .lbl { font-size: 13px; color: var(--text-2); margin-top: 4px; }

  .finish-seg { display: grid; grid-template-columns: 1fr 130px; gap: 14px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border-soft); }
  @media (max-width: 560px) { .finish-seg { grid-template-columns: 1fr 100px; } }
  .finish-seg:last-child { border-bottom: none; }
  .finish-seg .nm { font-size: 14px; font-weight: 560; }
  .finish-seg .meta { font-size: 11px; color: var(--text-3); margin-top: 1px; }
  .finish-seg input { height: 38px; text-align: center; }

  .note-ta {
    width: 100%; min-height: 72px; padding: 13px 15px; border: 1px solid var(--border);
    border-radius: 13px; font-size: 14px; font-family: var(--font); resize: vertical; outline: none;
    background: var(--card); color: var(--text); transition: border-color .16s, box-shadow .16s;
  }
  .note-ta:focus { border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent-soft); }

  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(24px);
    background: var(--toast-bg); color: var(--toast-text); padding: 12px 22px; border-radius: 13px; font-size: 14px;
    max-width: calc(100vw - 40px); text-align: center; line-height: 1.5;
    opacity: 0; pointer-events: none; transition: all .28s cubic-bezier(.2,.9,.3,1.1); z-index: 100;
    box-shadow: 0 8px 32px rgba(0,0,0,.28);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 统计 ===== */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(122px, 1fr)); gap: 14px; }
  .stat {
    background: var(--hover); border: 1px solid var(--border-soft);
    border-radius: 14px; padding: 15px 15px 13px; position: relative; overflow: hidden;
  }
  .stat::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2.5px;
    background: linear-gradient(90deg, var(--accent), transparent 70%);
    opacity: .55;
  }
  .stat .v {
    font-family: var(--mono); font-size: 25px; font-weight: 250; letter-spacing: -.012em;
    font-variant-numeric: tabular-nums; color: var(--text); line-height: 1.25;
  }
  .stat .l { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }

  /* ===== 热力图(主题色阶) ===== */
  .heat-grid { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 2px; }
  .heat-col { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
  .heat-cell { width: 12px; height: 12px; border-radius: 3.5px; background: var(--heat-empty); display: inline-block; vertical-align: middle; }
  .heat-cell.lv1 { background: rgba(var(--accent-rgb), .22); }
  .heat-cell.lv2 { background: rgba(var(--accent-rgb), .45); }
  .heat-cell.lv3 { background: rgba(var(--accent-rgb), .7); }
  .heat-cell.lv4 { background: rgb(var(--accent-rgb)); box-shadow: 0 0 6px rgba(var(--accent-rgb), .5); }
  .heat-cell.future { background: transparent; }
  .heat-legend { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 11px; color: var(--text-3); flex-wrap: wrap; gap: 6px; }
  .heat-scale { display: inline-flex; align-items: center; gap: 3px; }

  /* ===== 成就墙 ===== */
  .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .ach {
    border: 1px solid var(--border-soft); border-radius: 13px; padding: 13px 10px; text-align: center;
    background: var(--hover); opacity: .42; filter: grayscale(1); transition: all .22s;
  }
  .ach.on { opacity: 1; filter: none; background: var(--card); border-color: var(--border); }
  .ach-ico {
    width: 35px; height: 35px; margin: 0 auto 9px; border-radius: 50%;
    background: var(--border-soft); color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 660;
  }
  .ach.on .ach-ico {
    background: var(--accent-soft); color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft), 0 0 16px rgba(var(--accent-rgb), .3);
  }
  .ach-name { font-size: 12.5px; font-weight: 610; }
  .ach-desc { font-size: 10.5px; color: var(--text-3); margin-top: 3px; line-height: 1.35; }

  /* ===== 考试管理（设置页） ===== */
  .exam-mgmt-item {
    display: flex; align-items: center; gap: 11px; padding: 13px 15px;
    border: 1px solid var(--border); border-radius: 13px; margin-bottom: 8px;
    background: var(--card); transition: all .16s;
  }
  .exam-mgmt-item:hover { border-color: var(--text-3); }
  .exam-mgmt-item.active { border-color: rgba(var(--accent-rgb), .55); background: var(--accent-soft); }
  .exam-mgmt-item .cdot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 3.5px rgba(0,0,0,.06); }
  .exam-mgmt-item .name { flex: 1; font-size: 14px; font-weight: 570; min-width: 0; }
  .exam-mgmt-item .meta { font-size: 11px; color: var(--text-3); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .badge-current {
    font-size: 10px; font-weight: 620; color: var(--accent-ink);
    background: var(--card); border: 1px solid rgba(var(--accent-rgb), .35);
    border-radius: 6px; padding: 2px 7px; flex-shrink: 0;
  }

  /* ===== 移动端底部导航 ===== */
  .bottom-nav { display: none; }
  @media (max-width: 560px) {
    .bottom-nav {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 55;
      background: rgba(247,247,244,.92);
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      border-top: 1px solid var(--border-soft);
      padding: 5px 10px calc(6px + env(safe-area-inset-bottom, 0px));
    }
    html[data-theme="dark"] .bottom-nav { background: rgba(15,15,19,.92); }
    .bottom-nav .bn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      border: none; background: none; color: var(--text-3); font-size: 10.5px;
      font-family: var(--font); padding: 5px 0 3px; border-radius: 10px; cursor: pointer;
      transition: color .15s; font-weight: 530;
    }
    .bottom-nav .bn svg { width: 21px; height: 21px; }
    .bottom-nav .bn.active { color: var(--accent); font-weight: 640; }
    body { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
    .tbtn.navlink { display: none; }
  }

  /* ===== 历史页工具条 / 复盘 ===== */
  .hist-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .hist-tools input[type=text] { height: 38px; font-size: 13.5px; border-radius: 10px; flex: 1; min-width: 170px; }
  .rev-group { margin-bottom: 18px; }
  .rev-sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .rev-sec-head .nm { font-size: 14.5px; font-weight: 640; }
  .rev-count { font-size: 11px; color: var(--text-3); background: var(--border-soft); border-radius: 6px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
  .rev-item { border: 1px solid var(--border-soft); border-radius: 13px; padding: 13px 16px; margin-bottom: 8px; background: var(--card); }
  .rev-item .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .rev-item .dt { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .rev-item .acc { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .rev-item .sub { font-size: 12.5px; color: var(--text-2); margin-top: 5px; }
  .rev-item .note { font-size: 12.5px; color: var(--text-2); margin-top: 6px; padding: 8px 11px; background: var(--hover); border-radius: 9px; line-height: 1.55; }

  /* ===== 随机抽卡(首页) ===== */
  .rand-hint { font-size: 11.5px; color: var(--text-3); margin-top: 10px; }
  .draw-stage {
    display: none; perspective: 1100px; margin-top: 18px;
    flex-direction: column; align-items: center; gap: 16px;
  }
  .draw-stage.show { display: flex; animation: fadeUp2 .45s cubic-bezier(.2,.9,.3,1.1) both; }
  @keyframes fadeUp2 { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .draw-card {
    width: 232px; height: 312px; position: relative;
    transform-style: preserve-3d;
    transform: rotateY(180deg);
    transition: transform .78s cubic-bezier(.25,.8,.3,1.05);
  }
  .draw-card.flip { transform: rotateY(0deg); }
  .draw-face {
    position: absolute; inset: 0; border-radius: 22px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 13px; padding: 26px 22px; text-align: center; overflow: hidden;
  }
  .draw-back {
    transform: rotateY(180deg);
    background: var(--card);
    border: 1.5px dashed var(--border);
    color: var(--text-3);
    box-shadow: var(--shadow);
  }
  .draw-back .q { font-family: var(--mono); font-size: 74px; font-weight: 200; line-height: 1; }
  .draw-back .bt { font-size: 10.5px; letter-spacing: .22em; }
  .draw-front {
    background:
      radial-gradient(130% 100% at 85% -10%, rgba(255,255,255,.22), transparent 55%),
      linear-gradient(165deg, var(--accent-ink), var(--accent) 55%, rgba(var(--accent-rgb), .88));
    color: #fff;
    box-shadow: 0 18px 44px rgba(var(--accent-rgb), .4);
    justify-content: space-between;
    gap: 8px;
    padding: 20px 18px 18px;
  }
  .df-top, .df-bottom { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; z-index: 1; }
  .df-bottom { gap: 6px; }
  .df-deco {
    position: absolute; top: 50%; left: 0; right: 0;
    transform: translateY(-50%);
    display: flex; justify-content: center;
    color: rgba(255,255,255,.4); pointer-events: none;
  }
  .df-deco svg { width: 52px; height: 52px; }
  .df-tag { font-size: 9px; font-weight: 680; letter-spacing: .26em; text-transform: uppercase; opacity: .85; }
  .df-name { font-size: 23px; font-weight: 720; letter-spacing: -.01em; line-height: 1.2; text-shadow: 0 1px 10px rgba(0,0,0,.25); }
  .df-sub { font-size: 10.5px; opacity: .88; line-height: 1.45; }
  .df-rows { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
  .df-pill {
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.26);
    border-radius: 999px; padding: 2.5px 9px; font-size: 10.5px; font-weight: 570;
    font-variant-numeric: tabular-nums; backdrop-filter: blur(4px);
  }
  .df-cta { font-size: 9.5px; opacity: .7; }
  .draw-actions { display: flex; gap: 10px; animation: fadeUp2 .4s .95s both; }
  .draw-actions .btn { min-width: 118px; }
  .draw-tools { display: flex; gap: 6px; justify-content: center; animation: fadeUp2 .4s 1.05s both; }
  .sr-file { position: absolute; width: 1px; height: 1px; opacity: .02; overflow: hidden; }
  /* 自定义卡面图 */
  .draw-front.has-img { background-size: cover; background-position: center; }
  .draw-front.has-img::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(0,0,0,.58) 0%, rgba(0,0,0,.2) 16%, rgba(0,0,0,.05) 34%,
      rgba(0,0,0,.05) 60%, rgba(0,0,0,.62) 100%);
  }
  .draw-front.has-img .df-top,
  .draw-front.has-img .df-bottom { text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  @media (max-width: 400px) {
    .draw-card { width: 198px; height: 274px; }
    .df-name { font-size: 20px; }
    .draw-back .q { font-size: 58px; }
  }

  .hidden { display: none !important; }

  /* ================================================================
   * 动效
   * ================================================================ */
  #app.view-in { animation: viewIn .3s cubic-bezier(.25,.8,.3,1) both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.92) translateY(-4px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="go('home')">
      <span class="brand-mark" id="brandMark"></span>
      <span class="bt">行测·计时器</span>
    </div>
    <div class="exam-switch" id="examSwitchWrap">
      <button class="exam-switch-btn" id="examSwitchBtn" onclick="toggleExamDropdown()">
        <span class="exam-dot" id="examDot"></span>
        <span class="nm" id="examSwitchLabel">国考</span>
        <span class="arrow" id="chevIcon"></span>
      </button>
      <div class="exam-dropdown" id="examDropdown"></div>
    </div>
    <div class="spacer"></div>
    <div class="today-pill" id="todayPill">—</div>
    <button class="tbtn navlink" onclick="go('stats')" title="统计"><span id="icoStats"></span><span class="lb">统计</span></button>
    <button class="tbtn navlink" onclick="go('history')" title="历史"><span id="icoHistory"></span><span class="lb">历史</span></button>
    <button class="tbtn navlink" onclick="go('settings')" title="设置"><span id="icoSettings"></span><span class="lb">设置</span></button>
    <button class="tbtn" onclick="cycleTheme()" id="themeBtn" title="主题"></button>
    <div class="exam-switch" id="exportWrap">
      <button class="tbtn" onclick="toggleExportMenu()" title="导出数据"><span id="icoExport"></span><span class="lb">导出</span><span class="arrow" id="exportChev" style="display:inline-flex"></span></button>

/* =====================================================================
 * 主题(浅/深)管理
 * =================================================================== */
const LS_THEME = 'xctimer_theme_v1';   // 'auto' | 'light' | 'dark'
let CUR_ACCENT = '#4f46e5';
let THEME_COLORS = {};

function themeMode() { return localStorage.getItem(LS_THEME) || 'auto'; }
function resolvedTheme() {
  const m = themeMode();
  if (m !== 'auto') return m;
  return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function refreshPalette() {
  const dark = resolvedTheme() === 'dark';
  THEME_COLORS = dark ? {
    accent: CUR_ACCENT, ok: '#34d399',
    grid: '#26262d', refLine: '#3f3f46', dotFill: '#17171d', label: '#8d8d99',
  } : {
    accent: CUR_ACCENT, ok: '#059669',
    grid: '#ececea', refLine: '#d4d4d8', dotFill: '#ffffff', label: '#71717a',
  };
}
function applyTheme() {
  const r = resolvedTheme();
  document.documentElement.setAttribute('data-theme', r);
  document.documentElement.style.colorScheme = r;
  refreshPalette();
  applyExamTheme();      // ink 需按明暗重算
  updateThemeBtn();
}
function cycleTheme() {
  const order = ['auto', 'light', 'dark'];
  const next = order[(order.indexOf(themeMode()) + 1) % 3];
  localStorage.setItem(LS_THEME, next);
  applyTheme();
  toast(next === 'auto' ? '主题:跟随系统' : next === 'light' ? '主题:浅色' : '主题:深色');
}
function updateThemeBtn() {
  const btn = document.getElementById('themeBtn');
  if (!btn) return;
  const m = themeMode();
  btn.innerHTML = ico(m === 'light' ? 'sun' : m === 'dark' ? 'moon' : 'contrast', 15);
  btn.title = '主题:' + (m === 'auto' ? '跟随系统' : m === 'light' ? '浅色' : '深色') + '(点击切换)';
}
if (window.matchMedia) {
  try {
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (themeMode() === 'auto') applyTheme();
    });
  } catch (e) {}
}

/* =====================================================================
 * 考试主题色注入
 * =================================================================== */
function hexToRgb(hex) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function mixHex(hex, target, ratio) {   // ratio: 0=原色 1=目标色
  const a = hexToRgb(hex), b = hexToRgb(target);
  const c = a.map((v, i) => Math.round(v + (b[i] - v) * ratio));
  return '#' + c.map(v => v.toString(16).padStart(2,'0')).join('');
}
function applyExamTheme() {
  const ex = activeExam ? activeExam() : null;
  const hex = ex && ex.theme ? ex.theme : '#4f46e5';
  CUR_ACCENT = hex;
  const [r, g, b] = hexToRgb(hex);
  const root = document.documentElement;
  root.style.setProperty('--accent', hex);
  root.style.setProperty('--accent-rgb', r + ',' + g + ',' + b);
  const dark = resolvedTheme() === 'dark';
  root.style.setProperty('--accent-ink', dark ? mixHex(hex, '#ffffff', .26) : mixHex(hex, '#000000', .16));
  refreshPalette();
  // 顶部考试色点
  const dot = document.getElementById('examDot');
  if (dot) dot.style.background = hex;
}

/* =====================================================================
 * 数据层(v2 多考试)
 * =================================================================== */
const LS_RECORDS = 'xctimer_records_v1';
const LS_CONFIG  = 'xctimer_config_v2';
const LS_CONFIG_OLD = 'xctimer_config_v1';
const LS_PLANS   = 'xctimer_plans_v1';

let config, records, plans;
let customExamSeq = 0;

function initData() {
  let rawCfg = localStorage.getItem(LS_CONFIG);
  if (rawCfg) {
    try {
      config = JSON.parse(rawCfg);
      for (const [id, preset] of Object.entries(EXAM_PRESETS))
        if (!config.exams[id]) config.exams[id] = structuredClone(preset);
    } catch (e) { config = null; }
  }
  if (!config) {
    const oldRaw = localStorage.getItem(LS_CONFIG_OLD);
    if (oldRaw) {
      try { config = migrateV1ToV2(JSON.parse(oldRaw)); }
      catch (e) { config = null; }
    }
  }
  if (!config) {
    config = {
      activeExamId: 'guokao',
      errorTypes: ['知识点不会', '粗心失误', '时间不够', '蒙的'],
      weeklyGoalDays: 5,
      exams: structuredClone(EXAM_PRESETS),
    };
  }
  if (!config.exams[config.activeExamId])
    config.activeExamId = Object.keys(config.exams)[0] || 'guokao';

  customExamSeq = Object.keys(config.exams)
    .filter(k => k.startsWith('custom-'))
    .reduce((max, k) => Math.max(max, parseInt(k.replace('custom-','')) || 0), 0);

  try { records = JSON.parse(localStorage.getItem(LS_RECORDS)) || []; }
  catch (e) { records = []; }
  try { plans = JSON.parse(localStorage.getItem(LS_PLANS)) || {}; }
  catch (e) { plans = {}; }

  // 补齐缺失的主题色
  let ci = 0;
  for (const [id, ex] of Object.entries(config.exams)) {
    if (!ex.theme) {
      ex.theme = EXAM_PRESETS[id] ? EXAM_PRESETS[id].theme : CUSTOM_THEMES[ci++ % CUSTOM_THEMES.length];
    }
  }

  saveConfig();
  saveRecords();
}

function migrateV1ToV2(old) {
  const exams = structuredClone(EXAM_PRESETS);
  const gk = exams['guokao'];
  if (old.sections) gk.sections = old.sections;
  if (old.mockOrder) gk.mockOrder = old.mockOrder;
  if (old.totalMinutes != null) gk.totalMinutes = old.totalMinutes;
  if (old.targetAccuracy != null) gk.targetAccuracy = old.targetAccuracy;
  if (old.examName) gk.examName = old.examName;
  if (old.examDate) gk.examDate = old.examDate;

  const cfg = {
    activeExamId: 'guokao',
    errorTypes: old.errorTypes || ['知识点不会', '粗心失误', '时间不够', '蒙的'],
    weeklyGoalDays: old.weeklyGoalDays || 5,
    exams,
  };
  let recs = [];
  try { recs = JSON.parse(localStorage.getItem(LS_RECORDS)) || []; } catch (e) {}
  recs.forEach(r => { if (!r.examId) r.examId = 'guokao'; });
  localStorage.setItem(LS_RECORDS, JSON.stringify(recs));
  localStorage.removeItem(LS_CONFIG_OLD);
  return cfg;
}

function activeExam() { return config.exams[config.activeExamId]; }
function activeExamId() { return config.activeExamId; }
function examById(id) { return config.exams[id]; }

function saveConfig() { localStorage.setItem(LS_CONFIG, JSON.stringify(config)); }
function saveRecords() { localStorage.setItem(LS_RECORDS, JSON.stringify(records)); }
function savePlans() {
  const keys = Object.keys(plans).sort();
  if (keys.length > 60) keys.slice(0, keys.length - 60).forEach(k => delete plans[k]);
  localStorage.setItem(LS_PLANS, JSON.stringify(plans));
}

/* ----- 考试切换 / 管理 ----- */
function switchExam(examId) {
  if (config.activeExamId === examId) { closeExamDropdown(); return; }
  config.activeExamId = examId;
  saveConfig();
  closeExamDropdown();
  applyExamTheme();
  render();
}
function deleteExam(examId) {
  if (Object.keys(config.exams).length <= 1) { toast('至少保留一个考试'); return; }
  if (EXAM_PRESETS[examId]) { toast('预设考试不能删除'); return; }
  if (!confirm(`确定删除「${config.exams[examId].name}」？该考试下的所有练习记录不会被删除，但将无法再通过切换查看到它们。`)) return;
  delete config.exams[examId];
  if (config.activeExamId === examId) config.activeExamId = Object.keys(config.exams)[0];
  saveConfig();
  applyExamTheme();
  render();
}
function createCustomExam() {
  customExamSeq++;
  const id = 'custom-' + customExamSeq;
  const template = structuredClone(EXAM_PRESETS['guokao'].sections);
  config.exams[id] = {
    name: '自定义考试 ' + customExamSeq,
    theme: CUSTOM_THEMES[(customExamSeq - 1) % CUSTOM_THEMES.length],
    totalMinutes: 120, targetAccuracy: 75,
    examName: '', examDate: '',
    sections: template,
    mockOrder: template.filter(s => !s.isTuka).map(s => s.id).concat('tuka'),
  };
  config.activeExamId = id;
  saveConfig();
  closeExamDropdown();
  applyExamTheme();
  go('settings');
}
function setExamTheme(v) {
  const ex = activeExam();
  if (!ex || !v) return;
  ex.theme = v;
  saveConfig();
  applyExamTheme();
}

/* ----- 考试下拉 ----- */
function updateExamSwitchBtn() {
  const label = document.getElementById('examSwitchLabel');

function toggleExamDropdown() {
  const dd = document.getElementById('examDropdown');
  if (!dd) return;
  dd.classList.toggle('show');
  if (dd.classList.contains('show')) renderExamDropdown();
}
function closeExamDropdown() {
  const dd = document.getElementById('examDropdown');
  if (dd) dd.classList.remove('show');
}
document.addEventListener('click', function(e) {
  const wrap = document.getElementById('examSwitchWrap');
  const dd = document.getElementById('examDropdown');
  if (wrap && dd && !wrap.contains(e.target)) dd.classList.remove('show');
  const ew = document.getElementById('exportWrap');
  const em = document.getElementById('exportMenu');
  if (ew && em && !ew.contains(e.target)) em.classList.remove('show');
});

/* ----- 底部导航激活态 ----- */
function updateBottomNav() {
  const nav = document.getElementById('bottomNav');
  if (!nav) return;
  nav.querySelectorAll('.bn').forEach(b => {
    b.classList.toggle('active', b.dataset.v === view);
  });
}
function renderExamDropdown() {
  const dd = document.getElementById('examDropdown');
  if (!dd) return;
  const active = activeExamId();
  let html = '';
  for (const [id, exam] of Object.entries(config.exams)) {
    html += `<button class="item ${id === active ? 'active' : ''}" onclick="switchExam('${id}')">
      <span class="dot" style="background:${esc(exam.theme || '#4f46e5')}"></span>
      <span class="lbl">${esc(exam.name)}</span>
      ${id === active ? `<span class="check">${ico('check', 14)}</span>` : ''}
    </button>`;
  }
  html += `<div class="divider"></div>`;
  html += `<button class="item add" onclick="createCustomExam()">${ico('plus', 14)}<span class="lbl">新建考试</span></button>`;
  dd.innerHTML = html;
}

  { id:'allround', ico:'遍', name:'全板块开荒', desc:'每个板块都练过至少一组',            check: c => c.allround },
  { id:'early',    ico:'早', name:'早起鸟',     desc:'早上 7 点前开始练习',               check: c => c.early },
  { id:'night',    ico:'夜', name:'夜猫子',     desc:'晚上 11 点后开始练习',              check: c => c.night },
];

function achContext() {
  const ctx = {
    count: records.length, totalMs: 0, totalQ: 0, mockCount: 0,
    mockInTime: false, perfect: false, fast: false, ontarget: false,
    early: false, night: false, allround: false,
    streakLongest: streakInfo().longest,
    practiced: {},
  };
  function feed(sectionId, timeMs, qcount, correct, examId) {
    const exam = examById(examId);
    const sec = exam ? exam.sections.find(s => s.id === sectionId) : null;
    if (sec && !sec.isTuka) ctx.practiced[sectionId] = true;
    if (!qcount || qcount <= 0 || !timeMs || timeMs <= 0) return;
    ctx.totalQ += qcount;
    const ref = refTimeFor(sectionId, qcount, examId);
    const acc = correct != null ? correct / qcount : null;
    if (qcount >= 5 && acc === 1) ctx.perfect = true;
    if (qcount >= 10 && ref > 0) {
      if (timeMs <= ref * 0.9) ctx.fast = true;
      if (timeMs <= ref && acc != null && acc >= 0.85) ctx.ontarget = true;
    }
  }
  for (const r of records) {
    ctx.totalMs += (r.timeMs || 0);
    const h = new Date(r.startAt || r.date).getHours();
    if (h < 7) ctx.early = true;
    if (h >= 23) ctx.night = true;
    if (r.type === 'section') {
      feed(r.sectionId, r.timeMs, r.questionCount, r.correct, r.examId || 'guokao');
    } else if (r.type === 'mock') {
      ctx.mockCount++;
      if (r.timeMs && r.targetMs && r.timeMs <= r.targetMs) ctx.mockInTime = true;
      for (const g of (r.segments || [])) feed(g.sectionId, g.timeMs, g.questionCount, g.correct, r.examId || 'guokao');
    }
  }
  const allRealIds = new Set();
  Object.values(config.exams).forEach(ex => ex.sections.filter(s => !s.isTuka).forEach(s => allRealIds.add(s.id)));
  ctx.allround = allRealIds.size > 0 && [...allRealIds].every(id => ctx.practiced[id]);
  return ctx;
}
function unlockedSet() {
  const ctx = achContext();
  return new Set(ACHIEVEMENTS.filter(a => a.check(ctx)).map(a => a.id));
}
function newlyUnlocked(before) {
  const now = unlockedSet();
  return ACHIEVEMENTS.filter(a => now.has(a.id) && !before.has(a.id));
}

/* =====================================================================
 * 工具函数
 * =================================================================== */
function $(sel) { return document.querySelector(sel); }
function secById(id, examId) {
  const ex = examId ? examById(examId) : activeExam();
  return ex ? ex.sections.find(s => s.id === id) : null;
}
function secName(id) { const s = secById(id); return s ? s.name : id; }

function fmtTime(ms) {
  const neg = ms < 0; ms = Math.abs(ms);
  const total = Math.round(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const mm = h > 0 ? String(m).padStart(2,'0') : String(m);
  const out = h > 0 ? `${h}:${mm}:${String(s).padStart(2,'0')}` : `${mm}:${String(s).padStart(2,'0')}`;
  return (neg ? '-' : '') + out;
}
function fmtMinSec(ms) {
  const total = Math.round(ms / 1000);
  return `${Math.floor(total/60)}分${total%60}秒`;
}
function fmtDate(iso) {
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtClock(iso) {
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}
function dayKeyOf(iso) {
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function todayKey() { return dayKeyOf(new Date().toISOString()); }
function recordDay(r) { return dayKeyOf(r.startAt || r.date); }

function dateKey(d) {
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function dayOrdinal(key) {
  const [y,m,d] = key.split('-').map(Number);
  return Math.round(Date.UTC(y, m-1, d) / 86400000);
}
function daysToExam() {
  const exam = activeExam();
  if (!exam.examDate) return null;
  const [y,m,d] = exam.examDate.split('-').map(Number);
  if (!y || !m || !d) return null;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((new Date(y, m-1, d) - today) / 86400000);
}
function practiceDayMap() {
  const m = {};
  for (const r of records) {
    const k = recordDay(r);
    m[k] = (m[k] || 0) + (r.timeMs || 0);
  }
  return m;
}
function streakInfo() {
  const dayMap = practiceDayMap();
  const keys = Object.keys(dayMap);
  const set = new Set(keys);
  let cur = 0;
  let d = new Date();
  if (!set.has(dateKey(d))) d = addDays(d, -1);
  while (set.has(dateKey(d))) { cur++; d = addDays(d, -1); }
  let longest = 0, run = 0, prev = null;
  const ords = keys.map(dayOrdinal).sort((a,b) => a-b);
  for (const o of ords) {
    if (prev != null && o === prev + 1) run++; else run = 1;
    if (run > longest) longest = run;
    prev = o;
  }
  return { cur, longest, totalDays: keys.length, practicedToday: set.has(todayKey()) };
}
function weekDays() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dow = (today.getDay() + 6) % 7;
  const mon = addDays(today, -dow);
  const labels = ['一','二','三','四','五','六','日'];
  const dayMap = practiceDayMap();
  return labels.map((label, i) => {
    const d = addDays(mon, i);
    const key = dateKey(d);
    return { key, label, done: !!dayMap[key], isToday: key === todayKey(), future: d > today };
  });
}
function timeRangeHtml(r) {
  if (r.startAt && r.endAt) return `${esc(fmtDate(r.startAt))} - ${esc(fmtClock(r.endAt))}`;
  return esc(fmtDate(r.date));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function refPace(id, examId) {
  const s = secById(id, examId);
  return s && s.count > 0 ? (s.minutes*60 / s.count) : null;
}
function refTimeFor(id, qcount, examId) {
  const s = secById(id, examId);
  if (!s) return 0;
  if (s.count > 0) return Math.round((s.minutes*60 / s.count) * qcount * 1000);
  return s.minutes * 60 * 1000;
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 1900);
}

/* 数字滚动动画(count-up) */
function runCountUps(scope) {
  scope.querySelectorAll('[data-cnt]').forEach(el => {
    const target = parseFloat(el.dataset.cnt);
    if (isNaN(target)) return;
    const fmt = el.dataset.fmt || 'int';
    const fmtFn = fmt === 'ms' ? v => fmtMinSec(v)
                : fmt === 'pct' ? v => v.toFixed(0) + '%'
                : v => String(Math.round(v));
    const dur = 720;
    const t0 = performance.now();
    function frame(now) {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmtFn(target * e);
      if (p < 1) requestAnimationFrame(frame);
      else el.textContent = fmtFn(target);
    }
    requestAnimationFrame(frame);
  });
}

/* =====================================================================
 * 计时器引擎
 * =================================================================== */
class Timer {
  constructor() { this.running = false; this.acc = 0; this.lastStart = null; }
  start() { if (!this.running) { this.running = true; this.lastStart = Date.now(); } }
  pause() { if (this.running) { this.acc += Date.now() - this.lastStart; this.running = false; } }
  elapsed() { return this.running ? this.acc + (Date.now() - this.lastStart) : this.acc; }
  reset() { this.running = false; this.acc = 0; this.lastStart = null; }
}

function suggestSectionId() {
  const exam = activeExam();
  const stats = sectionStats();
  let best = null, bestScore = -1;
  for (const s of exam.sections) {
    if (s.isTuka) continue;
    const st = stats[s.id];
    let score;
    if (!st) score = 2;
    else {
      const avgPace = st.paceSum / st.n;
      const acc = st.corTot > 0 ? (st.corN / st.corTot) * 100 : null;
      const tag = classify(avgPace, refPace(s.id), acc, exam.targetAccuracy);
      score = tag ? ({ '重点攻克': 4, '需深耕': 3, '需提速': 3, '保持': 0 }[tag.label] || 1) : 1;
      score += Math.max(0, 1 - st.n / 5) * 0.5;
    }
    if (score > bestScore) { bestScore = score; best = s.id; }
  }
  return best;
}

/* ----- 诊断表 ----- */
function sectionStats() {
  const er = examRecords();
  const m = {};
  const init = id => m[id] = m[id] || { id, n:0, msSum:0, paceSum:0, corN:0, corTot:0, over:0 };
  function feed(id, timeMs, qcount, correct, total) {
    if (qcount <= 0 || timeMs <= 0) return;
    const s = init(id);
    s.n++; s.msSum += timeMs;
    s.paceSum += (timeMs/1000) / qcount;
    const ref = refTimeFor(id, qcount);
    if (timeMs > ref && ref > 0) s.over++;
    if (correct != null && total > 0) { s.corN += correct; s.corTot += total; }
  }
  for (const r of er) {
    if (r.type === 'section') feed(r.sectionId, r.timeMs, r.questionCount, r.correct, r.questionCount);
    else if (r.type === 'mock')
      for (const seg of (r.segments || [])) feed(seg.sectionId, seg.timeMs, seg.questionCount, seg.correct, seg.questionCount);
  }
  return m;
}

function classify(avgPace, refP, acc, targetAcc) {
  const fast = refP == null ? null : (avgPace <= refP * 1.02);
  const accurate = acc == null ? null : (acc >= targetAcc);
  if (fast == null || accurate == null) return null;
  if (fast && accurate) return { label:'保持', cls:'pill-ok', tip:'快且准' };
  if (!fast && accurate) return { label:'需提速', cls:'pill-warn', tip:'慢但准' };
  if (fast && !accurate) return { label:'需深耕', cls:'pill-bad', tip:'快但错' };
  return { label:'重点攻克', cls:'pill-bad', tip:'慢且错' };
}

function renderDiag() {
  const exam = activeExam();
  const stats = sectionStats();
  const ids = exam.sections.map(s => s.id);
  const rows = ids.map(id => {
    const s = stats[id];
    const sec = secById(id);
    const avgPace = s ? s.paceSum / s.n : null;
    const acc = s && s.corTot > 0 ? (s.corN / s.corTot) * 100 : null;
    const refP = refPace(id);
    const tag = classify(avgPace, refP, acc, exam.targetAccuracy);
    return { id, sec, s, avgPace, acc, tag };
  }).filter(r => r.s && r.s.n > 0);

  if (rows.length === 0)
    return `<div class="card card-pad"><div class="empty">还没有练习记录,做完一组后这里会出现各板块的诊断。</div></div>`;

  let html = `<div class="card" style="overflow-x:auto"><table class="diag">
    <thead><tr><th>板块</th><th class="num">次数</th><th class="num">做对</th><th class="num">正确率</th>
    <th class="num">均速</th><th class="num">参考</th><th class="num">超时</th><th>诊断</th></tr></thead><tbody>`;
  for (const r of rows) {
    html += `<tr class="${selectedSection === r.id ? 'sel' : ''}" onclick="selectSection('${r.id}')">

/* ----- 趋势:点击诊断行/板块chip → 统计页趋势 tab ----- */
function selectSection(id) { selectedSection = id; statsViewMode = 'trend'; go('stats'); }

function trendData(id) {
  const er = examRecords();
  const out = [];
  const push = (date, timeMs, qcount, correct) => {
    if (qcount <= 0 || timeMs <= 0) return;
    out.push({ date, timeMs, qcount, correct, pace: (timeMs/1000)/qcount, acc: correct != null ? (correct/qcount)*100 : null });
  };
  for (const r of er) {
    if (r.type === 'section' && r.sectionId === id) push(r.date, r.timeMs, r.questionCount, r.correct);
    else if (r.type === 'mock') for (const seg of (r.segments||[]))
      if (seg.sectionId === id) push(r.date, seg.timeMs, seg.questionCount, seg.correct);
  }
  out.sort((a,b) => a.date.localeCompare(b.date));
  return out;
}

function renderTrend() {

function sparkline(points, opts) {
  if (!points || !points.length) return '<div class="empty" style="padding:20px">无数据</div>';
  const vals = points.map(p=>p.v).filter(v=>v!=null);
  if (!vals.length) return '<div class="empty" style="padding:20px">无数据</div>';
  const W=320,H=140,padX=12,top=24,bottom=120;
  let min=Math.min(...vals),max=Math.max(...vals);
  if(opts.ref!=null){min=Math.min(min,opts.ref);max=Math.max(max,opts.ref);}
  if(max-min<1e-9){max+=1;min-=1;}
  const X=i=>points.length===1?W/2:padX+(i/(points.length-1))*(W-padX*2);
  const Y=v=>bottom-((v-min)/(max-min))*(bottom-top);
  const segs=[];let cur=[];
  points.forEach((p,i)=>{if(p.v==null){if(cur.length){segs.push(cur);cur=[];}}else cur.push([X(i),Y(p.v)]);});
  if(cur.length)segs.push(cur);
  const gid='g'+Math.random().toString(36).slice(2,7);
  let area='',line='';
  for(const s of segs){if(s.length<2)continue;const d=smoothPath(s);line+=`<path d="${d}" fill="none" stroke="${opts.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;area+=`<path d="${d} L ${s[s.length-1][0].toFixed(1)},${bottom} L ${s[0][0].toFixed(1)},${bottom} Z" fill="url(#${gid})"/>`;}
  const dots=segs.flat().map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" fill="${THEME_COLORS.dotFill}" stroke="${opts.color}" stroke-width="2"/>`).join('');
  let grid='';for(let k=1;k<=3;k++){const y=Y(min+(max-min)*(k/4)).toFixed(1);grid+=`<line x1="${padX}" y1="${y}" x2="${W-padX}" y2="${y}" stroke="${THEME_COLORS.grid}" stroke-width="1"/>`;}
  let refEl='';if(opts.ref!=null){const y=Y(opts.ref).toFixed(1);refEl=`<line x1="${padX}" y1="${y}" x2="${W-padX}" y2="${y}" stroke="${THEME_COLORS.refLine}" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W-padX}" y="${Math.max(12,y-6).toFixed(1)}" font-size="8.5" fill="${THEME_COLORS.label}" text-anchor="end" stroke="${THEME_COLORS.dotFill}" stroke-width="3" paint-order="stroke">参考 ${opts.ref.toFixed(0)}${esc(opts.unit||'')}</text>`;}
  let curVal=null;for(let i=points.length-1;i>=0;i--)if(points[i].v!=null){curVal=points[i].v;break;}
  const curTxt=curVal==null?'—':(Number.isInteger(curVal)?String(curVal):curVal.toFixed(1));
  return `<div class="spark"><div class="spark-head"><div class="spark-title">${esc(opts.title)}${opts.hint?`<span class="spark-hint">${esc(opts.hint)}</span>`:''}</div><div class="spark-cur" style="color:${opts.color}">${curTxt}<span class="spark-unit">${esc(opts.unit||'')}</span></div></div><svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${opts.color}" stop-opacity="0.18"/><stop offset="1" stop-color="${opts.color}" stop-opacity="0"/></linearGradient></defs>${grid}${area}${line}${refEl}${dots}</svg></div>`;
}

function smoothPath(pts) {
  if(!pts||pts.length<2)return'';
  let d=`M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;d+=` C ${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}
  return d;
}

function buildReviewList(er) {
  const q = (histQ || '').trim().toLowerCase();
  let list = er.filter(r => r.type === 'section' && ((r.errorType && r.errorType.length) || r.note));
  if (q) list = list.filter(r => {
    const hay = [secName(r.sectionId), r.subType||'', r.note||'', (r.errorType||[]).join(' ')].join(' ').toLowerCase();
    return hay.includes(q);
  });
  if (!list.length) return `<div class="card card-pad"><div class="empty">${er.length ? '还没有带错因或备注的练习<br>做完题填上错因,这里就是你的考前复盘本' : '暂无记录'}</div></div>`;
  list.sort((a,b)=>b.date.localeCompare(a.date));
  const groups = {};
  for (const r of list) (groups[r.sectionId] = groups[r.sectionId] || []).push(r);
  let html = `<div class="row mb-16" style="justify-content:space-between"><span class="muted" style="font-size:13px">共 ${list.length} 条待复盘</span></div>`;
  const ids = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
  for (const id of ids) {
    const items = groups[id];
    const errCount = {};
    items.forEach(r=>(r.errorType||[]).forEach(t=>errCount[t]=(errCount[t]||0)+1));
    const errSummary = Object.entries(errCount).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`${t}×${n}`).join(' · ');

    for (const r of items) {
      const acc = r.correct != null && r.questionCount > 0 ? (r.correct/r.questionCount*100).toFixed(0)+'%' : '—';
      html += `<div class="rev-item">
        <div class="top"><span class="dt">${timeRangeHtml(r)} · ${r.questionCount} 题 · 用时 ${fmtTime(r.timeMs)}</span><span class="acc">${acc}</span></div>

        ${r.note?`<div class="note">${esc(r.note)}</div>`:''}
      </div>`;
    }
    html += `</div>`;
  }
  return html;
}

function aggregate(list) {
  const out = { count:0, totalMs:0, totalQ:0, correct:0, total:0, bySection:{} };
  const sec = id => (out.bySection[id]=out.bySection[id]||{ms:0,q:0,correct:0,total:0});
  for (const r of list) {
    out.count++; out.totalMs+=(r.timeMs||0);
    if (r.type==='section') {
      out.totalQ+=(r.questionCount||0);
      if(r.correct!=null&&r.questionCount>0){out.correct+=r.correct;out.total+=r.questionCount;}
      const s=sec(r.sectionId);s.ms+=(r.timeMs||0);s.q+=(r.questionCount||0);
      if(r.correct!=null&&r.questionCount>0){s.correct+=r.correct;s.total+=r.questionCount;}
    } else if(r.type==='mock') for(const g of(r.segments||[])){
      if(g.questionCount<=0)continue;out.totalQ+=g.questionCount;
      if(g.correct!=null){out.correct+=g.correct;out.total+=g.questionCount;}
      const s=sec(g.sectionId);s.ms+=(g.timeMs||0);s.q+=g.questionCount;
      if(g.correct!=null){s.correct+=g.correct;s.total+=g.questionCount;}
    }
  }
  return out;
}
function accPct(a){return a.total>0?(a.correct/a.total*100):null;}
function accCell(a){const p=accPct(a);return p==null?'—':p.toFixed(0)+'%';}
function scoreText(c,t){return(c!=null&&t>0)?`对 ${c} / ${t} 题`:'—';}

    return;
