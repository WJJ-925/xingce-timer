<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>行测计时器</title>
<style>
  :root {
    --bg: #f6f6f4;
    --card: #ffffff;
    --text: #18181b;
    --text-2: #71717a;
    --text-3: #a1a1aa;
    --border: #e4e4e7;
    --border-soft: #efefed;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --accent-ink: #4338ca;
    --ok: #059669;
    --ok-soft: #ecfdf5;
    --warn: #d97706;
    --warn-soft: #fffbeb;
    --bad: #dc2626;
    --bad-soft: #fef2f2;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(24,24,27,.04), 0 8px 24px rgba(24,24,27,.05);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding-bottom: 48px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

  /* ===== 顶部栏 ===== */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(246,246,244,.86);
    backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--border-soft);
  }
  .topbar-inner {
    max-width: 880px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .brand { font-size: 15px; font-weight: 650; letter-spacing: -.01em; cursor: pointer; white-space: nowrap; }
  .brand .dot { color: var(--accent); }
  .topbar .spacer { flex: 1; }
  .today-pill {
    font-size: 12px; color: var(--text-2);
    background: var(--card); border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 999px; white-space: nowrap;
  }
  .icon-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text-2);
    height: 34px; padding: 0 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
    transition: all .15s; font-family: var(--font);
  }
  .icon-btn:hover { border-color: var(--text-3); color: var(--text); }
  @media (max-width: 560px) {
    .topbar-inner { padding: 10px; gap: 6px; }
    .today-pill { display: none; }
    .icon-btn { padding: 0 8px; font-size: 12px; }
  }

  /* ===== 通用 ===== */
  h1 { font-size: 26px; font-weight: 680; letter-spacing: -.02em; }
  .muted { color: var(--text-2); }
  .muted-3 { color: var(--text-3); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .card-pad { padding: 24px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: .02em; }
  .row { display: flex; align-items: center; gap: 10px; }
  .gap-8 { gap: 8px; }
  .mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; } .mt-32 { margin-top: 32px; }
  .mb-8 { margin-bottom: 8px; } .mb-16 { margin-bottom: 16px; } .mb-24 { margin-bottom: 24px; }
  .wrap-2 { flex-wrap: wrap; }

  button { font-family: var(--font); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    height: 44px; padding: 0 20px; border-radius: 12px; font-size: 15px; cursor: pointer;
    transition: all .15s; font-weight: 550;
  }
  .btn:hover { border-color: var(--text-3); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
  .btn-ghost:hover { color: var(--text); background: var(--border-soft); }
  .btn-danger { color: var(--bad); }
  .btn-sm { height: 34px; padding: 0 14px; font-size: 13px; border-radius: 10px; }
  .btn-block { width: 100%; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 550;
  }
  .pill-ok { background: var(--ok-soft); color: var(--ok); }
  .pill-warn { background: var(--warn-soft); color: var(--warn); }
  .pill-bad { background: var(--bad-soft); color: var(--bad); }
  .pill-gray { background: #f4f4f5; color: var(--text-2); }

  /* ===== 首页 ===== */
  .hero { padding: 40px 0 8px; }
  .hero h1 { font-size: 34px; font-weight: 700; letter-spacing: -.03em; text-wrap: balance; }
  .hero .sub { color: var(--text-2); font-size: 15px; margin-top: 6px; }
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .mode-grid { grid-template-columns: 1fr; } }
  .mode-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 26px; cursor: pointer; transition: all .18s;
    display: flex; flex-direction: column; gap: 6px;
  }
  .mode-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(24,24,27,.08); border-color: var(--text-3); }
  .mode-card .ico { font-size: 22px; }
  .mode-card .t { font-size: 18px; font-weight: 650; }
  .mode-card .d { font-size: 13px; color: var(--text-2); }

  /* ===== 诊断表 ===== */
  table.diag { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.diag th, table.diag td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--border-soft); }
  table.diag th { color: var(--text-3); font-weight: 500; font-size: 12px; white-space: nowrap; }
  table.diag td.num, table.diag th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.diag tr:last-child td { border-bottom: none; }
  table.diag tbody tr { cursor: pointer; transition: background .12s; }
  table.diag tbody tr:hover { background: #fafaf9; }
  table.diag tbody tr.sel { background: var(--accent-soft); }

  /* ===== 折线图 ===== */
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 560px) { .chart-row { grid-template-columns: 1fr; } }
  .chart-box svg { display: block; width: 100%; height: auto; }
  .spark-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .spark-title { font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: .01em; }
  .spark-hint { font-size: 11px; font-weight: 500; color: var(--text-3); margin-left: 6px; }
  .spark-cur { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .spark-unit { font-size: 11px; font-weight: 500; color: var(--text-3); margin-left: 2px; }

  /* ===== 计时器 ===== */
  .timer-hero { text-align: center; padding: 32px 0 16px; }
  .timer-label { font-size: 14px; color: var(--text-2); }
  .timer-num {
    font-family: var(--mono); font-weight: 200; letter-spacing: -.02em;
    font-size: clamp(60px, 18vw, 150px); line-height: 1.05;
    font-variant-numeric: tabular-nums; color: var(--text);
    margin: 8px 0 4px; transition: color .3s;
  }
  .timer-num.overdue { color: var(--bad); animation: blink 1s steps(2,start) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .timer-meta { color: var(--text-3); font-size: 13px; }
  .timer-meta b { color: var(--text); font-weight: 600; }
  .progress { height: 4px; background: var(--border-soft); border-radius: 999px; overflow: hidden; margin-top: 20px; }
  .progress > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
  .progress > i.over { background: var(--bad); }

  .seg-list { display: flex; flex-direction: column; gap: 6px; }
  .seg-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: 12px; font-size: 14px;
  }
  .seg-item.cur { border-color: var(--accent); background: var(--accent-soft); }
  .seg-item.done { color: var(--text-3); }
  .seg-item .gi { width: 22px; height: 22px; border-radius: 50%; background: var(--border-soft);
    display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-2); flex-shrink: 0; }
  .seg-item.done .gi { background: var(--ok); color: #fff; }
  .seg-item.cur .gi { background: var(--accent); color: #fff; }
  .seg-item .nm { flex: 1; }
  .seg-item .tm { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 13px; color: var(--text-2); }
  .seg-item.cur .tm { color: var(--accent-ink); }

  /* ===== 表单 ===== */
  label.fl { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 6px; font-weight: 550; }
  input[type=number], input[type=text], input[type=date], select {
    width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--border);
    border-radius: 12px; font-size: 15px; font-family: var(--font); color: var(--text);
    background: var(--card); transition: border-color .15s; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type=number] { font-variant-numeric: tabular-nums; }

  .opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .opt {
    border: 1px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer;
    transition: all .14s; background: var(--card); text-align: left;
  }
  .opt:hover { border-color: var(--text-3); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt .t { font-size: 14px; font-weight: 600; }
  .opt .s { font-size: 12px; color: var(--text-2); margin-top: 2px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border); background: var(--card); border-radius: 999px;
    padding: 6px 14px; font-size: 13px; cursor: pointer; transition: all .14s; color: var(--text-2);
  }
  .chip.sel { border-color: var(--accent); background: var(--accent); color: #fff; }

  .seg-input { display: grid; grid-template-columns: 1fr 96px 96px 40px; gap: 8px; align-items: center; }
  @media (max-width: 560px) { .seg-input { grid-template-columns: 1fr 80px 40px; } .seg-input .hide-sm { display: none; } }
  .drag-btn { border: none; background: transparent; color: var(--text-3); cursor: grab; font-size: 16px; padding: 4px; }
  .drag-btn:hover { color: var(--text); }

  /* ===== 空状态 ===== */
  .empty { text-align: center; padding: 40px 20px; color: var(--text-3); font-size: 14px; }

  /* ===== 完成页 ===== */
  .result-big { text-align: center; padding: 8px 0; }
  .result-big .val { font-family: var(--mono); font-size: 40px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .result-big .lbl { font-size: 13px; color: var(--text-2); }

  .finish-seg { display: grid; grid-template-columns: 1fr 130px; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-soft); }
  @media (max-width: 560px) { .finish-seg { grid-template-columns: 1fr 100px; } }
  .finish-seg:last-child { border-bottom: none; }
  .finish-seg .nm { font-size: 14px; font-weight: 550; }
  .finish-seg .meta { font-size: 11px; color: var(--text-3); }
  .finish-seg input { height: 38px; text-align: center; }

  .note-ta { width: 100%; min-height: 70px; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 12px; font-size: 14px; font-family: var(--font); resize: vertical; outline: none; background: var(--card); }
  .note-ta:focus { border-color: var(--accent); }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: #fff; padding: 11px 20px; border-radius: 12px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 100; box-shadow: var(--shadow);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px; }
  .stat .v {
    font-family: var(--mono); font-size: 24px; font-weight: 300; letter-spacing: -.01em;
    font-variant-numeric: tabular-nums; color: var(--text);
  }
  .stat .l { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  /* ===== 今日计划 ===== */
  .plan-card { --plan-x: 24px; padding: 0; overflow: hidden; }
  .plan-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; padding: 22px var(--plan-x) 0;
  }
  .plan-eyebrow {
    font-size: 10.5px; font-weight: 650; letter-spacing: .13em;
    color: var(--text-3); text-transform: uppercase;
  }
  .plan-title { font-size: 19px; font-weight: 680; letter-spacing: -.015em; margin-top: 5px; }
  .exam-chip {
    display: inline-flex; align-items: baseline; gap: 4px; flex-shrink: 0;
    background: var(--accent-soft); color: var(--accent-ink);
    border-radius: 999px; padding: 7px 13px; font-size: 12px; white-space: nowrap;
  }
  .exam-chip b {
    font-family: var(--mono); font-size: 17px; font-weight: 600;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  }
  .exam-chip.dim { background: var(--bg); color: var(--text-3); }
  .exam-chip.hot { background: var(--warn-soft); color: var(--warn); }
  .plan-progress { display: flex; align-items: center; gap: 12px; padding: 16px var(--plan-x) 0; }
  .plan-bar {
    flex: 1; height: 4px; border-radius: 99px;
    background: var(--border-soft); overflow: hidden;
  }
  .plan-bar i {
    display: block; height: 100%; border-radius: inherit;
    background: linear-gradient(90deg, #6366f1, var(--accent));
    transition: width .35s cubic-bezier(.4,0,.2,1);
  }
  .plan-progress-text {
    font-size: 11.5px; color: var(--text-3); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .plan-progress.all-done .plan-bar i { background: var(--ok); }
  .plan-progress.all-done .plan-progress-text { color: var(--ok); font-weight: 550; }
  .plan-list { display: flex; flex-direction: column; gap: 8px; margin: 14px var(--plan-x) 0; }
  .plan-item {
    display: flex; align-items: center; gap: 11px; padding: 10px 12px;
    border: 1px solid transparent; border-radius: 12px; background: #fafaf8;
    transition: background .15s, border-color .15s;
  }
  .plan-item:hover { background: #f4f4f1; }
  .plan-item:focus-within { background: var(--card); border-color: var(--border); }
  .plan-item.done { background: #f7f9f8; }
  .plan-check {
    width: 21px; height: 21px; border-radius: 50%; border: 1.5px solid #d4d4d8;
    background: var(--card); color: #fff; font-size: 11px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; padding: 0;
    transition: all .18s;
  }
  .plan-check:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .plan-item.done .plan-check { background: var(--ok); border-color: var(--ok); }
  input.plan-text {
    flex: 1; min-width: 0; height: auto; padding: 0; border: none; background: transparent;
    font-size: 14px; color: var(--text); box-shadow: none; outline: none;
  }
  input.plan-text:focus { border: none; box-shadow: none; }
  .plan-item.done input.plan-text { color: var(--text-3); text-decoration: line-through; }
  .plan-del {
    width: 24px; height: 24px; border: none; border-radius: 50%; background: transparent;
    color: var(--text-3); font-size: 15px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .15s, background .15s, color .15s; flex-shrink: 0;
  }
  .plan-item:hover .plan-del { opacity: 1; }
  .plan-del:hover { background: var(--bad-soft); color: var(--bad); }
  @media (max-width: 560px) { .plan-del { opacity: .55; } }   /* 触屏没有 hover,删除按钮常显 */
  .plan-empty { padding: 30px var(--plan-x) 20px; text-align: center; }
  .plan-empty b { display: block; font-size: 13.5px; font-weight: 550; color: var(--text-2); }
  .plan-empty span { display: block; margin-top: 4px; font-size: 12px; color: var(--text-3); }
  .plan-add {
    display: flex; align-items: center; gap: 8px; margin: 12px var(--plan-x) 0;
    padding: 4px 4px 4px 13px; border: 1px solid transparent; border-radius: 12px;
    background: var(--bg); transition: background .15s, border-color .15s;
  }
  .plan-add:focus-within { background: var(--card); border-color: var(--border); }
  .plan-add-icon { color: var(--text-3); font-size: 15px; line-height: 1; }
  input.plan-new {
    flex: 1; min-width: 0; height: 34px; padding: 0; border: none;
    background: transparent; box-shadow: none; font-size: 13px;
  }
  input.plan-new:focus { border: none; box-shadow: none; }
  .plan-add-btn {
    height: 30px; padding: 0 13px; border: none; border-radius: 9px;
    background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 550;
    cursor: pointer; transition: background .15s; flex-shrink: 0;
  }
  .plan-add-btn:hover { background: var(--accent-ink); }
  .plan-suggest {
    display: flex; align-items: center; gap: 8px; margin: 10px var(--plan-x) 0;
    padding: 9px 10px 9px 12px; border: 1px solid var(--border-soft);
    border-radius: 12px; background: var(--card); font-size: 12px; color: var(--text-2);
  }
  .sug-tag {
    flex-shrink: 0; font-size: 10.5px; font-weight: 600; color: var(--accent-ink);
    background: var(--accent-soft); border-radius: 6px; padding: 2px 6px;
  }
  .sug-text { flex: 1; min-width: 0; }
  .sug-add {
    flex-shrink: 0; height: 26px; padding: 0 10px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card); color: var(--text); font-size: 12px;
    cursor: pointer; transition: all .15s;
  }
  .sug-add:hover { border-color: var(--accent); color: var(--accent-ink); }
  .week-strip {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    margin: 18px var(--plan-x) 0; padding-top: 16px; border-top: 1px solid var(--border-soft);
  }
  .week-day { text-align: center; padding: 2px 0; }
  .week-day .wd-label { display: block; font-size: 10.5px; color: var(--text-3); margin-bottom: 7px; }
  .week-day .wd-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #dededb;
  }
  .week-day.done .wd-dot { background: var(--accent); }
  .week-day.today .wd-label { color: var(--accent-ink); font-weight: 650; }
  .week-day.today:not(.done) .wd-dot {
    background: var(--card); border: 1.5px solid var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .week-day.today.done .wd-dot { box-shadow: 0 0 0 3px var(--accent-soft); }
  .week-day.future { opacity: .4; }
  .plan-foot {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
    margin: 16px var(--plan-x) 0; padding: 14px 0 20px;
    font-size: 11.5px; color: var(--text-3);
  }
  @media (max-width: 560px) { .plan-card { --plan-x: 18px; } }

  /* ===== 热力图 ===== */
  .heat-grid { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 2px; }
  .heat-col { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
  .heat-cell { width: 12px; height: 12px; border-radius: 3px; background: #f0f0ee; display: inline-block; vertical-align: middle; }
  .heat-cell.lv1 { background: #dbe0ff; }
  .heat-cell.lv2 { background: #b6bdfb; }
  .heat-cell.lv3 { background: #7c84f2; }
  .heat-cell.lv4 { background: #4f46e5; }
  .heat-cell.future { background: transparent; }
  .heat-legend { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 11px; color: var(--text-3); flex-wrap: wrap; gap: 6px; }
  .heat-scale { display: inline-flex; align-items: center; gap: 3px; }

  /* ===== 成就墙 ===== */
  .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .ach {
    border: 1px solid var(--border-soft); border-radius: 12px; padding: 12px 10px; text-align: center;
    background: #fcfcfb; opacity: .42; filter: grayscale(1); transition: all .2s;
  }
  .ach.on { opacity: 1; filter: none; background: var(--card); border-color: var(--border); }
  .ach-ico {
    width: 34px; height: 34px; margin: 0 auto 8px; border-radius: 50%; background: var(--border-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 650; color: var(--text-2);
  }
  .ach.on .ach-ico { background: var(--accent-soft); color: var(--accent-ink); }
  .ach-name { font-size: 12.5px; font-weight: 600; }

<div class="wrap" id="app"><!-- 视图动态渲染 --></div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
 * 数据层
 * =================================================================== */
const LS_RECORDS = 'xctimer_records_v1';
const LS_CONFIG  = 'xctimer_config_v1';
const LS_PLANS   = 'xctimer_plans_v1';

const DEFAULT_CONFIG = {
  totalMinutes: 120,
  targetAccuracy: 75,          // 目标正确率 %
  errorTypes: ['知识点不会', '粗心失误', '时间不够', '蒙的'],
  examName: '2027 国考',
  examDate: '2026-11-29',      // 考试日期,可改
  weeklyGoalDays: 5,           // 每周目标练习天数
  // 板块: id, name, count(默认题量), minutes(目标时间), subTypes(可选), isTuka(零题量环节)
  sections: [
    { id:'ziliao',   name:'资料分析',   count:20, minutes:25, subTypes:[] },
    { id:'panduan',  name:'判断推理',   count:35, minutes:32, subTypes:['图形推理','定义判断','类比推理','逻辑判断'] },
    { id:'yanyu',    name:'言语理解',   count:30, minutes:22, subTypes:['逻辑填空','片段阅读','语句表达'] },
    { id:'shuliang', name:'数量关系',   count:10, minutes:10, subTypes:[] },
    { id:'zhengzhi', name:'政治理论',   count:20, minutes:13, subTypes:[] },
    { id:'changshi', name:'常识判断',   count:15, minutes:8,  subTypes:[] },
    { id:'tuka',     name:'填涂答题卡', count:0,  minutes:6,  subTypes:[], isTuka:true },
  ],
  // 套卷默认顺序(用户习惯:资料→言语→数量→判断→政治理论→常识→涂卡)
  mockOrder: ['ziliao','yanyu','shuliang','panduan','zhengzhi','changshi','tuka'],
};

function loadConfig() {
  try {
    const raw = localStorage.getItem(LS_CONFIG);
    if (!raw) return structuredClone(DEFAULT_CONFIG);
    const c = JSON.parse(raw);
    // 兼容旧数据:补齐字段
    return Object.assign(structuredClone(DEFAULT_CONFIG), c, {
      sections: c.sections || structuredClone(DEFAULT_CONFIG.sections),
      mockOrder: c.mockOrder || structuredClone(DEFAULT_CONFIG.mockOrder),
      errorTypes: c.errorTypes || structuredClone(DEFAULT_CONFIG.errorTypes),
    });
  } catch (e) { return structuredClone(DEFAULT_CONFIG); }
}
function saveConfig() { localStorage.setItem(LS_CONFIG, JSON.stringify(config)); }

function loadRecords() {
  try { return JSON.parse(localStorage.getItem(LS_RECORDS)) || []; }
  catch (e) { return []; }
}
function saveRecords() { localStorage.setItem(LS_RECORDS, JSON.stringify(records)); }

let config = loadConfig();
let records = loadRecords();

/* ----- 每日计划清单(按天保存,可增删改) ----- */
function loadPlans() {
  try { return JSON.parse(localStorage.getItem(LS_PLANS)) || {}; } catch (e) { return {}; }
}
let plans = loadPlans();
function savePlans() {
  // 只保留最近 60 天,避免无限增长
  const keys = Object.keys(plans).sort();
  if (keys.length > 60) keys.slice(0, keys.length - 60).forEach(k => delete plans[k]);
  localStorage.setItem(LS_PLANS, JSON.stringify(plans));
}
function getTodayPlan() { return plans[todayKey()] || []; }
function pushPlanItem(text) {
  const k = todayKey();
  (plans[k] = plans[k] || []).push({ id: uid(), text, done: false });
  savePlans();
}

/* =====================================================================
 * 成就
 * =================================================================== */
const ACHIEVEMENTS = [
  { id:'first',    ico:'初', name:'初次打卡',   desc:'完成第一组练习',                     check: c => c.count >= 1 },
  { id:'ten',      ico:'十', name:'十组起步',   desc:'累计练习 10 组',                      check: c => c.count >= 10 },
  { id:'fifty',    ico:'五', name:'五十组',     desc:'累计练习 50 组',                      check: c => c.count >= 50 },
  { id:'hundred',  ico:'百', name:'百组里程碑', desc:'累计练习 100 组',                     check: c => c.count >= 100 },
  { id:'mock1',    ico:'套', name:'首战套卷',   desc:'完成第一次套卷',                      check: c => c.mockCount >= 1 },
  { id:'mock5',    ico:'卷', name:'套卷老手',   desc:'完成 5 次套卷',                       check: c => c.mockCount >= 5 },
  { id:'mocktime', ico:'稳', name:'稳稳当当',   desc:'套卷在目标时间内完成',                check: c => c.mockInTime },
  { id:'perfect',  ico:'全', name:'全对一次',   desc:'单组 ≥5 题全部做对',                  check: c => c.perfect },
  { id:'fast',     ico:'快', name:'快枪手',     desc:'单组 ≥10 题,均速比参考快 10%',        check: c => c.fast },
  { id:'ontarget', ico:'达', name:'稳准狠',     desc:'单组 ≥10 题,按时完成且正确率 ≥85%',   check: c => c.ontarget },
  { id:'streak3',  ico:'3',  name:'三日不辍',   desc:'连续练习 3 天',                       check: c => c.streakLongest >= 3 },
  { id:'streak7',  ico:'7',  name:'一周不断',   desc:'连续练习 7 天',                       check: c => c.streakLongest >= 7 },
  { id:'streak14', ico:'14', name:'半月苦修',   desc:'连续练习 14 天',                      check: c => c.streakLongest >= 14 },
  { id:'tenhours', ico:'时', name:'十小时',     desc:'累计练习满 10 小时',                  check: c => c.totalMs >= 10 * 3600 * 1000 },
  { id:'q1000',    ico:'千', name:'千题斩',     desc:'累计做满 1000 题',                    check: c => c.totalQ >= 1000 },
  { id:'allround', ico:'遍', name:'全板块开荒', desc:'每个板块都练过至少一组',              check: c => c.allround },
  { id:'early',    ico:'早', name:'早起鸟',     desc:'早上 7 点前开始练习',                 check: c => c.early },
  { id:'night',    ico:'夜', name:'夜猫子',     desc:'晚上 11 点后开始练习',                check: c => c.night },
];

// 汇总成就所需的全部指标
function achContext() {
  const ctx = {
    count: records.length, totalMs: 0, totalQ: 0, mockCount: 0,
    mockInTime: false, perfect: false, fast: false, ontarget: false,
    early: false, night: false, allround: false,
    streakLongest: streakInfo().longest,
    practiced: {},
  };

  // 一条练习(专项整组,或套卷中的一段)
  function feed(sectionId, timeMs, qcount, correct) {
    const sec = secById(sectionId);
    if (sec && !sec.isTuka) ctx.practiced[sectionId] = true;
    if (!qcount || qcount <= 0 || !timeMs || timeMs <= 0) return;
    ctx.totalQ += qcount;
    const ref = refTimeFor(sectionId, qcount);
    const acc = correct != null ? correct / qcount : null;
    if (qcount >= 5 && acc === 1) ctx.perfect = true;
    if (qcount >= 10 && ref > 0) {
      if (timeMs <= ref * 0.9) ctx.fast = true;
      if (timeMs <= ref && acc != null && acc >= 0.85) ctx.ontarget = true;
    }
  }

  for (const r of records) {
    ctx.totalMs += (r.timeMs || 0);
    const h = new Date(r.startAt || r.date).getHours();
    if (h < 7) ctx.early = true;
    if (h >= 23) ctx.night = true;
    if (r.type === 'section') {
      feed(r.sectionId, r.timeMs, r.questionCount, r.correct);
    } else if (r.type === 'mock') {
      ctx.mockCount++;
      if (r.timeMs && r.targetMs && r.timeMs <= r.targetMs) ctx.mockInTime = true;
      for (const g of (r.segments || [])) feed(g.sectionId, g.timeMs, g.questionCount, g.correct);
    }
  }

  const real = config.sections.filter(s => !s.isTuka);
  ctx.allround = real.length > 0 && real.every(s => ctx.practiced[s.id]);
  return ctx;
}
function unlockedSet() {
  const ctx = achContext();
  return new Set(ACHIEVEMENTS.filter(a => a.check(ctx)).map(a => a.id));
}
// 保存记录后对比,返回本次新解锁的成就
function newlyUnlocked(before) {
  const now = unlockedSet();
  return ACHIEVEMENTS.filter(a => now.has(a.id) && !before.has(a.id));
}

/* =====================================================================
 * 工具函数
 * =================================================================== */
function $(sel) { return document.querySelector(sel); }
function secById(id) { return config.sections.find(s => s.id === id); }
function secName(id) { const s = secById(id); return s ? s.name : id; }

function fmtTime(ms) {
  const neg = ms < 0; ms = Math.abs(ms);
  const total = Math.round(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const mm = h > 0 ? String(m).padStart(2,'0') : String(m);
  const out = h > 0 ? `${h}:${mm}:${String(s).padStart(2,'0')}` : `${mm}:${String(s).padStart(2,'0')}`;
  return (neg ? '-' : '') + out;
}
function fmtMinSec(ms) {
  const total = Math.round(ms / 1000);
  return `${Math.floor(total/60)}分${total%60}秒`;
}
function fmtDate(iso) {
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtClock(iso) {
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}
function dayKeyOf(iso) {
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function todayKey() { return dayKeyOf(new Date().toISOString()); }
// 一条记录归属哪一天(按开始时间,旧数据回退到保存时间)
function recordDay(r) { return dayKeyOf(r.startAt || r.date); }

/* ----- 日期 / 连续天数 / 周视图 ----- */
function dateKey(d) {
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function dayOrdinal(key) {
  const [y,m,d] = key.split('-').map(Number);
  return Math.round(Date.UTC(y, m-1, d) / 86400000);
}
function daysToExam() {
  if (!config.examDate) return null;
  const [y,m,d] = config.examDate.split('-').map(Number);
  if (!y || !m || !d) return null;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((new Date(y, m-1, d) - today) / 86400000);
}
// 每天练了多久(仅用于热力图)
function practiceDayMap() {
  const m = {};
  for (const r of records) {
    const k = recordDay(r);
    m[k] = (m[k] || 0) + (r.timeMs || 0);
  }
  return m;
}
// 当前连续天数(今天还没练时从昨天起算)、历史最长、总天数
function streakInfo() {
  const dayMap = practiceDayMap();
  const keys = Object.keys(dayMap);
  const set = new Set(keys);
  let cur = 0;
  let d = new Date();
  if (!set.has(dateKey(d))) d = addDays(d, -1);
  while (set.has(dateKey(d))) { cur++; d = addDays(d, -1); }

  let longest = 0, run = 0, prev = null;
  const ords = keys.map(dayOrdinal).sort((a,b) => a-b);
  for (const o of ords) {
    if (prev != null && o === prev + 1) run++; else run = 1;
    if (run > longest) longest = run;
    prev = o;
  }
  return { cur, longest, totalDays: keys.length, practicedToday: set.has(todayKey()) };
}
// 本周一~周日,标记是否练习/今天/未来
function weekDays() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dow = (today.getDay() + 6) % 7;      // 周一 = 0
  const mon = addDays(today, -dow);
  const labels = ['一','二','三','四','五','六','日'];
  const dayMap = practiceDayMap();
  return labels.map((label, i) => {
    const d = addDays(mon, i);
    const key = dateKey(d);
    return {
      key, label,
      done: !!dayMap[key],
      isToday: key === todayKey(),
      future: d > today,
    };
  });
}
// 历史记录的开始~结束时间(旧数据无 startAt/endAt 时回退为保存时间)
function timeRangeHtml(r) {
  if (r.startAt && r.endAt) return `${esc(fmtDate(r.startAt))} - ${esc(fmtClock(r.endAt))}`;
  return esc(fmtDate(r.date));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 某板块的参考均速(秒/题);涂卡无均速
function refPace(id) { const s = secById(id); return s && s.count > 0 ? (s.minutes*60 / s.count) : null; }
// 实际参考时间(毫秒) = 均速 × 题量;涂卡固定时间
function refTimeFor(id, qcount) {
  const s = secById(id);
  if (!s) return 0;
  if (s.count > 0) return Math.round((s.minutes*60 / s.count) * qcount * 1000);
  return s.minutes * 60 * 1000;
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 1800);
}

/* =====================================================================
 * 计时器引擎
 * =================================================================== */
class Timer {
  constructor() { this.running = false; this.acc = 0; this.lastStart = null; }
  start() { if (!this.running) { this.running = true; this.lastStart = Date.now(); } }
  pause() { if (this.running) { this.acc += Date.now() - this.lastStart; this.running = false; } }
  elapsed() { return this.running ? this.acc + (Date.now() - this.lastStart) : this.acc; }
  reset() { this.running = false; this.acc = 0; this.lastStart = null; }
}

/* =====================================================================
 * 视图状态
 * =================================================================== */
let view = 'home';
let session = null;   // 当前计时会话
let selectedSection = null;   // 首页选中板块(趋势)
let tickHandle = null;

function go(v) { view = v; render(); }
function startTick() { stopTick(); tickHandle = setInterval(onTick, 100); }
function stopTick() { if (tickHandle) { clearInterval(tickHandle); tickHandle = null; } }

function onTick() {
  if (view === 'section-timer') tickSectionTimer();
  else if (view === 'mock-timer') tickMockTimer();
}

/* =====================================================================
 * 渲染入口
 * =================================================================== */
function render() {
  const app = $('#app');
  stopTick();
  if (view === 'home') renderHome(app);
  else if (view === 'section-setup') renderSectionSetup(app);
  else if (view === 'section-timer') { renderSectionTimer(app); startTick(); }
  else if (view === 'section-finish') renderSectionFinish(app);
  else if (view === 'mock-setup') renderMockSetup(app);
  else if (view === 'mock-timer') { renderMockTimer(app); startTick(); }
  else if (view === 'mock-finish') renderMockFinish(app);
  else if (view === 'settings') renderSettings(app);
  else if (view === 'stats') renderStats(app);
  else if (view === 'history') renderHistory(app);
  updateTodayPill();
}

/* =====================================================================
 * 首页
 * =================================================================== */
/* ----- 今日计划卡(清单式) ----- */
// 根据诊断结果给出今天建议练的板块
function suggestSectionId() {
  const stats = sectionStats();
  let best = null, bestScore = -1;
  for (const s of config.sections) {
    if (s.isTuka) continue;
    const st = stats[s.id];
    let score;
    if (!st) score = 2;
    else {
      const avgPace = st.paceSum / st.n;
      const acc = st.corTot > 0 ? (st.corN / st.corTot) * 100 : null;
      const tag = classify(avgPace, refPace(s.id), acc, config.targetAccuracy);
      score = tag ? ({ '重点攻克': 4, '需深耕': 3, '需提速': 3, '保持': 0 }[tag.label] || 1) : 1;
      score += Math.max(0, 1 - st.n / 5) * 0.5;
    }
    if (score > bestScore) { bestScore = score; best = s.id; }
  }
  return best;
}

// 首页标题每天轮换一句
const HOME_QUIP = '量变引起质变，你不练只会变质';

function addPlanItem() {
  const el = $('#planNew');
  if (!el) return;
  const t = (el.value || '').trim();
  if (!t) return;
  pushPlanItem(t);
  render();
  const ni = $('#planNew');
  if (ni) ni.focus();
}
function addSuggestedPlan() {
  const s = secById(suggestSectionId());
  if (!s) return;
  const text = `${s.name} ${s.count} 题 / ${s.minutes} 分`;
  if (getTodayPlan().some(x => x.text === text)) { toast('已经在计划里了'); return; }
  pushPlanItem(text);
  toast('已加入今日计划');
  render();
}
function togglePlanItem(id) {
  const it = getTodayPlan().find(x => x.id === id);
  if (!it) return;
  it.done = !it.done;
  savePlans();
  render();
}
function renamePlanItem(id, v) {
  const it = getTodayPlan().find(x => x.id === id);
  if (!it) return;
  const t = (v || '').trim();
  if (!t) { render(); return; }     // 不允许改成空,空则还原
  it.text = t;
  savePlans();
}
function delPlanItem(id) {
  const k = todayKey();
  plans[k] = getTodayPlan().filter(x => x.id !== id);
  savePlans();
  render();
}

function renderPlanCard() {
  const items = getTodayPlan();
  const doneN = items.filter(i => i.done).length;
  const allDone = items.length > 0 && doneN === items.length;
  const pct = items.length ? Math.round(doneN / items.length * 100) : 0;
  const sk = streakInfo();
  const wk = weekDays();
  const weekDone = wk.filter(d => d.done).length;
  const wGoal = config.weeklyGoalDays || 0;
  const dt = daysToExam();
  const now = new Date();
  const dateStr = `${now.getMonth()+1}月${now.getDate()}日 周${'日一二三四五六'[now.getDay()]}`;

  let examHtml = '';
  if (dt == null) {
    examHtml = `<div class="exam-chip dim">设置考试日期</div>`;
  } else if (dt > 0) {
    examHtml = `<div class="exam-chip">距${esc(config.examName)} <b>${dt}</b> 天</div>`;
  } else if (dt === 0) {
    examHtml = `<div class="exam-chip hot">今天 · ${esc(config.examName)}</div>`;
  } else {
    examHtml = `<div class="exam-chip dim">${esc(config.examName)}已过 ${-dt} 天</div>`;
  }

  const list = items.length
    ? `<div class="plan-list">${items.map(it => `
        <div class="plan-item ${it.done ? 'done' : ''}">
          <button class="plan-check" onclick="togglePlanItem('${it.id}')" aria-label="标记完成">${it.done ? '✓' : ''}</button>
          <input class="plan-text" value="${esc(it.text)}" onchange="renamePlanItem('${it.id}',this.value)" spellcheck="false">
          <button class="plan-del" onclick="delPlanItem('${it.id}')" title="删除">×</button>
        </div>`).join('')}</div>`
    : `<div class="plan-empty"><b>今天还没有计划</b><span>在下面加一条，把今天安排明白</span></div>`;

  const sug = suggestSectionId();
  const sugSec = sug ? secById(sug) : null;

  return `<div class="card plan-card mt-16 mb-16">
    <div class="plan-top">
      <div>
        <div class="plan-eyebrow">TODAY · ${dateStr}</div>
        <div class="plan-title">今日计划</div>
      </div>
      ${examHtml}
    </div>

    ${items.length ? `<div class="plan-progress ${allDone ? 'all-done' : ''}">
      <div class="plan-bar"><i style="width:${pct}%"></i></div>
      <div class="plan-progress-text">${allDone ? `已完成 ${doneN} / ${items.length} · 全部完成` : `已完成 ${doneN} / ${items.length}`}</div>
    </div>` : ''}

    ${list}

    <div class="plan-add">
      <span class="plan-add-icon">＋</span>
      <input id="planNew" class="plan-new" placeholder="写一条今天的计划…" onkeydown="if(event.key==='Enter'){event.preventDefault();addPlanItem();}">
      <button class="plan-add-btn" onclick="addPlanItem()">添加</button>
    </div>

    ${sugSec ? `<div class="plan-suggest"><span class="sug-tag">建议</span><span class="sug-text"><b>${esc(sugSec.name)}</b> · ${sugSec.count} 题 / ${sugSec.minutes} 分</span><button class="sug-add" onclick="addSuggestedPlan()">加入</button></div>` : ''}

    <div class="week-strip">
      ${wk.map(d => `<div class="week-day ${d.done ? 'done' : ''} ${d.isToday ? 'today' : ''} ${d.future ? 'future' : ''}" title="${d.key}${d.done ? ' · 已练习' : ''}">
        <span class="wd-label">${d.label}</span><span class="wd-dot"></span>
      </div>`).join('')}

/* ----- 诊断表 ----- */
function sectionStats() {
  // 汇总: 板块id -> {n, accSum, paceSum, refSum, correctN, correctTotal, overN}
  const m = {};
  const init = id => m[id] = m[id] || { id, n:0, msSum:0, paceSum:0, corN:0, corTot:0, over:0 };

  function feed(id, timeMs, qcount, correct, total) {
    if (qcount <= 0 || timeMs <= 0) return;   // 跳过涂卡与提前结束未做的段
    const s = init(id);
    s.n++; s.msSum += timeMs;
    if (qcount > 0) s.paceSum += (timeMs/1000) / qcount;
    const ref = refTimeFor(id, qcount);
    if (timeMs > ref && ref > 0) s.over++;
    if (correct != null && total > 0) { s.corN += correct; s.corTot += total; }
  }

  for (const r of records) {
    if (r.type === 'section') {
      feed(r.sectionId, r.timeMs, r.questionCount, r.correct, r.questionCount);
    } else if (r.type === 'mock') {
      for (const seg of (r.segments || [])) {
        feed(seg.sectionId, seg.timeMs, seg.questionCount, seg.correct, seg.questionCount);
      }
    }
  }
  return m;
}

function classify(avgPace, refPace, acc, targetAcc) {
  const fast = refPace == null ? null : (avgPace <= refPace * 1.02);
  const accurate = acc == null ? null : (acc >= targetAcc);
  if (fast == null || accurate == null) return null;
  if (fast && accurate) return { label:'保持', cls:'pill-ok', tip:'快且准' };
  if (!fast && accurate) return { label:'需提速', cls:'pill-warn', tip:'慢但准' };
  if (fast && !accurate) return { label:'需深耕', cls:'pill-bad', tip:'快但错' };
  return { label:'重点攻克', cls:'pill-bad', tip:'慢且错' };
}

function trendData(id) {

    out.push({
      date, timeMs, qcount,
      pace: (timeMs/1000) / qcount,
      acc: correct != null ? (correct/qcount)*100 : null,
    });
  };
  for (const r of records) {
    if (r.type === 'section' && r.sectionId === id) push(r.date, r.timeMs, r.questionCount, r.correct);
    else if (r.type === 'mock') for (const seg of (r.segments||[]))
      if (seg.sectionId === id) push(r.date, seg.timeMs, seg.questionCount, seg.correct);
  }
  out.sort((a,b) => a.date.localeCompare(b.date));
  return out;
}

function sparkline(points, opts) {
  if (!points || points.length === 0) return '<div class="empty" style="padding:20px">无数据</div>';
  const vals = points.map(p => p.v).filter(v => v != null);
  if (vals.length === 0) return '<div class="empty" style="padding:20px">无数据</div>';

  const W = 320, H = 140, padX = 12, top = 24, bottom = 120;
  let min = Math.min(...vals), max = Math.max(...vals);
  if (opts.ref != null) { min = Math.min(min, opts.ref); max = Math.max(max, opts.ref); }
  if (max - min < 1e-9) { max += 1; min -= 1; }
  const X = i => points.length === 1 ? W/2 : padX + (i/(points.length-1)) * (W - padX*2);
  const Y = v => bottom - ((v - min)/(max - min)) * (bottom - top);

  // 按 null 断成多段,遇到缺失值断线而不是错误连线
  const segs = []; let cur = [];
  points.forEach((p, i) => {
    if (p.v == null) { if (cur.length) { segs.push(cur); cur = []; } }
    else cur.push([X(i), Y(p.v)]);
  });
  if (cur.length) segs.push(cur);

  const gid = 'g' + (opts.color || '000000').replace('#', '');

  // 平滑曲线 + 渐变面积
  let area = '', line = '';
  for (const s of segs) {
    if (s.length < 2) continue;
    const d = smoothPath(s);
    line += `<path d="${d}" fill="none" stroke="${opts.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    area += `<path d="${d} L ${s[s.length-1][0].toFixed(1)},${bottom} L ${s[0][0].toFixed(1)},${bottom} Z" fill="url(#${gid})"/>`;
  }
  // 数据点(白底描边)
  const dots = segs.flat().map(p =>
    `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" fill="#fff" stroke="${opts.color}" stroke-width="2"/>`
  ).join('');

  // 水平网格线(3 条)
  let grid = '';
  for (let k = 1; k <= 3; k++) {
    const y = Y(min + (max - min) * (k / 4)).toFixed(1);
    grid += `<line x1="${padX}" y1="${y}" x2="${W-padX}" y2="${y}" stroke="#ececea" stroke-width="1"/>`;
  }

  // 参考虚线 + 白描边标签
  let refEl = '';
  if (opts.ref != null) {
    const y = Y(opts.ref).toFixed(1);
    refEl = `<line x1="${padX}" y1="${y}" x2="${W-padX}" y2="${y}" stroke="#d4d4d8" stroke-dasharray="4 4" stroke-width="1.2"/>
      <text x="${W-padX}" y="${Math.max(12, y-6).toFixed(1)}" font-size="8.5" fill="#71717a" text-anchor="end" stroke="#ffffff" stroke-width="3" paint-order="stroke">参考 ${opts.ref.toFixed(0)}${esc(opts.unit||'')}</text>`;
  }

  // 最新值(最后一个非 null)
  let curVal = null;
  for (let i = points.length - 1; i >= 0; i--) if (points[i].v != null) { curVal = points[i].v; break; }
  const curTxt = curVal == null ? '—' : (Number.isInteger(curVal) ? String(curVal) : curVal.toFixed(1));

  return `<div class="spark">
    <div class="spark-head">
      <div class="spark-title">${esc(opts.title)}${opts.hint ? `<span class="spark-hint">${esc(opts.hint)}</span>` : ''}</div>
      <div class="spark-cur" style="color:${opts.color}">${curTxt}<span class="spark-unit">${esc(opts.unit||'')}</span></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${opts.color}" stop-opacity="0.16"/>
        <stop offset="1" stop-color="${opts.color}" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}${area}${line}${refEl}${dots}
    </svg>
  </div>`;
}

function smoothPath(pts) {
  if (!pts || pts.length < 2) return '';
  let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i-1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i+1];
    const p3 = pts[i+2] || p2;
    const c1x = p1[0] + (p2[0]-p0[0]) / 6;
    const c1y = p1[1] + (p2[1]-p0[1]) / 6;
    const c2x = p2[0] - (p3[0]-p1[0]) / 6;
    const c2y = p2[1] - (p3[1]-p1[1]) / 6;
    d += ` C ${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

// 聚合一组记录 → {count, totalMs, totalQ, correct, total, bySection}
function aggregate(list) {
  const out = { count:0, totalMs:0, totalQ:0, correct:0, total:0, bySection:{} };
  const sec = id => (out.bySection[id] = out.bySection[id] || { ms:0, q:0, correct:0, total:0 });
  for (const r of list) {
    out.count++;
    out.totalMs += (r.timeMs || 0);
    if (r.type === 'section') {
      out.totalQ += (r.questionCount || 0);
      if (r.correct != null && r.questionCount > 0) { out.correct += r.correct; out.total += r.questionCount; }
      const s = sec(r.sectionId);
      s.ms += (r.timeMs || 0); s.q += (r.questionCount || 0);
      if (r.correct != null && r.questionCount > 0) { s.correct += r.correct; s.total += r.questionCount; }
    } else if (r.type === 'mock') {
      for (const g of (r.segments || [])) {
        if (g.questionCount <= 0) continue;   // 涂卡等零题量环节不计题量与正确率
        out.totalQ += g.questionCount;
        if (g.correct != null) { out.correct += g.correct; out.total += g.questionCount; }
        const s = sec(g.sectionId);
        s.ms += (g.timeMs || 0); s.q += g.questionCount;
        if (g.correct != null) { s.correct += g.correct; s.total += g.questionCount; }
      }
    }
  }
  return out;
}
function accPct(a) { return a.total > 0 ? (a.correct / a.total * 100) : null; }
function accCell(a) { const p = accPct(a); return p == null ? '—' : p.toFixed(0) + '%'; }

/* ----- 练习热力图(近 13 周) ----- */
function renderHeatmap() {
  const weeks = 13;
  const dayMap = practiceDayMap();
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dow = (today.getDay() + 6) % 7;                 // 周一 = 0
  const start = addDays(today, -dow - (weeks - 1) * 7);

  let cols = '';
  for (let w = 0; w < weeks; w++) {
    let cells = '';
    for (let d = 0; d < 7; d++) {
      const day = addDays(start, w * 7 + d);
      const key = dateKey(day);
      if (day > today) { cells += `<span class="heat-cell future"></span>`; continue; }
      const ms = dayMap[key] || 0;
      const min = ms / 60000;
      const lv = ms <= 0 ? 0 : min < 20 ? 1 : min < 45 ? 2 : min < 90 ? 3 : 4;
      const label = ms <= 0 ? '未练习' : `${Math.max(1, Math.round(min))} 分钟`;
      cells += `<span class="heat-cell lv${lv}" title="${key} · ${label}"></span>`;
    }
    cols += `<div class="heat-col">${cells}</div>`;
  }

  return `<div class="card card-pad mb-16">
    <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:8px">
      <div class="section-title">练习热力图</div>
      <div class="muted-3" style="font-size:11px">${dateKey(start)} ~ ${dateKey(today)}</div>
    </div>
    <div class="heat-grid">${cols}</div>
    <div class="heat-legend">
      <span>近 ${weeks} 周 · 累计 ${streakInfo().totalDays} 天有练习</span>
      <span class="heat-scale">少 <i class="heat-cell lv0"></i><i class="heat-cell lv1"></i><i class="heat-cell lv2"></i><i class="heat-cell lv3"></i><i class="heat-cell lv4"></i> 多</span>
    </div>
  </div>`;
}

function pickSection(id) {
  session = { mode:'section', sectionId:id, subType:null, questionCount:secById(id).count, timeMode:'countup' };
  go('section-setup');
}
function renderSubTypes() {
  if (!session) return;
  const sec = secById(session.sectionId);
  const row = $('#subTypeRow'); const chips = $('#subTypeChips');
  if (!sec || !sec.subTypes.length) { row.classList.add('hidden'); return; }
  row.classList.remove('hidden');
  chips.innerHTML = sec.subTypes.map(st =>
    `<button class="chip ${session.subType===st?'sel':''}" onclick="pickSubType('${esc(st)}')">${esc(st)}</button>`).join('');
}
function pickSubType(st) { if (session) { session.subType = session.subType===st ? null : st; renderSubTypes(); } }

function setupPreview() {
  if (!session) return;
  const q = parseInt($('#qCount').value) || 0;
  const mode = $('#timeMode').value;
  session.questionCount = q; session.timeMode = mode;
  const targetWrap = $('#targetWrap');
  if (mode === 'countdown') {
    targetWrap.classList.remove('hidden');
    const defMin = refTimeFor(session.sectionId, q) / 60000;
    $('#targetMin').value = Math.max(1, Math.round(defMin));
  } else { targetWrap.classList.add('hidden'); }

  const refMs = refTimeFor(session.sectionId, q);
  const box = $('#setupPreviewBox');
  if (q > 0) {
    box.innerHTML = `<div class="row gap-8" style="font-size:13px;color:var(--text-2)">
      <span class="pill pill-gray">${esc(secName(session.sectionId))}${session.subType?' · '+esc(session.subType):''}</span>
      <span>参考时间 <b style="color:var(--text)">${fmtTime(refMs)}</b></span>
      ${refPace(session.sectionId)!=null ? `<span>参考均速 <b style="color:var(--text)">${refPace(session.sectionId).toFixed(0)}s/题</b></span>` : ''}
    </div>`;
  } else box.innerHTML = '';
}

function startSection() {
  if (!session || !session.sectionId) { toast('请先选择板块'); return; }
  const q = parseInt($('#qCount').value) || 0;
  if (q <= 0) { toast('题量需大于 0'); return; }
  session.questionCount = q;
  session.timeMode = $('#timeMode').value;
  session.targetMs = session.timeMode === 'countdown'
    ? Math.round(parseFloat($('#targetMin').value || '0') * 60 * 1000)
    : refTimeFor(session.sectionId, q);
  session.startAt = new Date().toISOString();
  session.timer = new Timer();
  session.timer.start();
  session.paused = false;
  session.done = false;
  go('section-timer');
}

function renderSectionTimer(app) {
  const s = session; const sec = secById(s.sectionId);
  app.innerHTML = `
    <div class="timer-hero">
      <div class="timer-label">${esc(sec.name)}${s.subType?' · '+esc(s.subType):''} · ${s.questionCount} 题</div>
      <div class="timer-num" id="bigNum"></div>
      <div class="timer-meta" id="tMeta"></div>
      <div class="progress hidden" id="tProgress"><i id="tProgressBar"></i></div>
      <div class="row mt-32" style="justify-content:center;gap:12px">
        <button class="btn" onclick="togglePause()" id="pauseBtn"></button>
        <button class="btn btn-primary" onclick="finishSection()">结束</button>
      </div>
    </div>`;
  tickSectionTimer();
}

function tickSectionTimer() {
  const s = session; if (!s) return;
  const el = s.timer.elapsed();
  const mode = s.timeMode;
  const remaining = mode === 'countdown' ? s.targetMs - el : null;
  const overdue = remaining != null && remaining <= 0;
  const overRef = el > refTimeFor(s.sectionId, s.questionCount);

  const big = $('#bigNum'); if (!big) return;
  big.textContent = fmtTime(overdue ? el : (remaining != null ? remaining : el));
  big.className = 'timer-num' + (overdue ? ' overdue' : '');

  $('#pauseBtn').textContent = s.paused ? '继续' : '暂停';

  let meta;
  if (mode === 'countdown') {
    meta = overdue ? `已超时 <b>+${fmtTime(el - s.targetMs)}</b>` : `剩余目标 <b>${fmtTime(remaining)}</b>`;
  } else {
    meta = `已用 <b>${fmtTime(el)}</b> · 参考 <b>${fmtTime(refTimeFor(s.sectionId, s.questionCount))}</b>` +
      (overRef ? ' <span class="pill pill-warn">超过参考时间</span>' : '');
  }
  $('#tMeta').innerHTML = meta;

  const prog = $('#tProgress');
  if (mode === 'countdown') {
    prog.classList.remove('hidden');
    const bar = $('#tProgressBar');
    bar.style.width = Math.min(100, el/s.targetMs*100).toFixed(1) + '%';
    bar.className = overdue ? 'over' : '';
  } else {
    prog.classList.add('hidden');
  }
}

function togglePause() {
  if (!session) return;
  if (session.paused) {
    if (session.mode === 'mock') { session.totalTimer.start(); session.segTimer.start(); }
    else session.timer.start();
    session.paused = false;
  } else {
    if (session.mode === 'mock') { session.totalTimer.pause(); session.segTimer.pause(); }
    else session.timer.pause();
    session.paused = true;
  }
  const btn = $('#pauseBtn');
  if (btn) btn.textContent = session.paused ? '继续' : '暂停';
  onTick();
}

function finishSection() {
  session.timer.pause();
  session.timeMs = session.timer.elapsed();
  session.endAt = new Date().toISOString();
  session.correct = null;
  session.errorType = [];
  session.note = '';
  go('section-finish');
}

function renderSectionFinish(app) {
  const s = session; const sec = secById(s.sectionId);
  const el = s.timeMs; const refMs = refTimeFor(s.sectionId, s.questionCount);
  const diff = el - refMs;
  const pace = s.questionCount > 0 ? (el/1000)/s.questionCount : 0;

  app.innerHTML = `
    <div class="hero" style="padding-bottom:16px">
      <div class="row mb-8"><button class="btn-ghost btn-sm" onclick="go('home')">← 返回</button></div>
      <h1>${esc(sec.name)}${s.subType?' · '+esc(s.subType):''}</h1>
      <div class="sub">${s.questionCount} 题</div>
    </div>

    <div class="card card-pad mb-16">
      <div class="result-big">
        <div class="val ${diff>0?'':''}">${fmtTime(el)}</div>
        <div class="lbl">用时 · 参考 ${fmtTime(refMs)} · ${diff>0 ? `超时 ${fmtTime(diff)}` : `富余 ${fmtTime(-diff)}`}</div>
      </div>
    </div>

    <div class="card card-pad mb-16">
      <div class="section-title mb-16">3 · 记录正确率</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div><label class="fl">做对题数 <span style="color:var(--bad)">*</span></label>
          <input type="number" id="correct" min="0" max="${s.questionCount}" placeholder="0-${s.questionCount}" oninput="clampCorrect(this, ${s.questionCount})"></div>
        <div><label class="fl">正确率</label>
          <div style="height:44px;display:flex;align-items:center;font-size:15px;color:var(--text-2)" id="accShow">—</div></div>
      </div>
      <div class="mt-16"><label class="fl">错因(选填,可多选)</label>
        <div class="chip-row" id="errChips">${config.errorTypes.map(t =>
          `<button class="chip" data-t="${esc(t)}" onclick="toggleErr(this,'${esc(t)}')">${esc(t)}</button>`).join('')}</div>
      </div>
      <div class="mt-16"><label class="fl">备注(选填)</label>
        <textarea class="note-ta" id="note" placeholder="例如:图推第三题卡了3分钟……"></textarea></div>
    </div>

    <button class="btn btn-primary btn-block" id="saveBtn" onclick="saveSection()">保存记录</button>`;

  const cEl = $('#correct'); const aEl = $('#accShow');
  cEl.addEventListener('input', () => {
    const c = parseInt(cEl.value);
    if (!isNaN(c) && c >= 0 && c <= s.questionCount) {
      aEl.textContent = (c/s.questionCount*100).toFixed(0) + '%';
    } else aEl.textContent = '—';
  });
  cEl.focus();
}

function toggleErr(btn, t) {
  if (!session) return;
  const i = session.errorType.indexOf(t);
  if (i >= 0) session.errorType.splice(i,1); else session.errorType.push(t);
  btn.classList.toggle('sel', i < 0);
}

function clampCorrect(el, max) {
  const v = parseInt(el.value);
  if (isNaN(v)) return;
  if (v < 0) el.value = 0;
  else if (v > max) el.value = max;
}

function saveSection() {
  const s = session;
  const c = parseInt($('#correct').value);
  if (isNaN(c) || c < 0 || c > s.questionCount) { toast('请填写正确的做对题数'); return; }
  const before = unlockedSet();
  s.correct = c;
  s.errorType = s.errorType || [];
  s.note = ($('#note') || {}).value || '';

  records.push({
    id: uid(), type: 'section', date: new Date().toISOString(),
    startAt: s.startAt || null, endAt: s.endAt || null,
    sectionId: s.sectionId, subType: s.subType || null,
    questionCount: s.questionCount, timeMs: Math.round(s.timeMs),
    targetMs: Math.round(s.targetMs), correct: s.correct,
    errorType: s.errorType, note: s.note,
  });
  saveRecords();
  const newly = newlyUnlocked(before);
  toast(newly.length
    ? `已保存 · 解锁「${newly[0].name}」${newly.length > 1 ? ` 等 ${newly.length} 个成就` : ''}`
    : '已保存');
  session = null;
  go('home');
}

function renderMockOrder() {

      <input type="number" class="hide-sm" value="${sec.count}" min="${sec.isTuka?0:1}" onchange="mockSegCount('${id}',this.value)" title="题量">
      <input type="number" value="${sec.minutes}" min="0" onchange="mockSegMin('${id}',this.value)" title="目标分钟">
      <div class="row gap-8" style="justify-content:flex-end">
        ${i>0 ? `<button class="drag-btn" onclick="mockMove('${id}',-1)" title="上移">↑</button>` : '<span></span>'}
        ${i<config.mockOrder.length-1 ? `<button class="drag-btn" onclick="mockMove('${id}',1)" title="下移">↓</button>` : '<span></span>'}
        ${!sec.isTuka ? `<button class="drag-btn" onclick="mockRemove('${id}')" title="移除">×</button>` : ''}
      </div>
    </div>`;
  }).join('');
  mockSetupSummary();
}

function mockSegCount(id, v) { const s = secById(id); if (s) s.count = Math.max(s.isTuka?0:1, parseInt(v)||0); }
function mockSegMin(id, v) { const s = secById(id); if (s) s.minutes = Math.max(0, parseInt(v)||0); }
function mockMove(id, dir) {
  const i = config.mockOrder.indexOf(id);
  const j = i + dir;
  if (j < 0 || j >= config.mockOrder.length) return;
  [config.mockOrder[i], config.mockOrder[j]] = [config.mockOrder[j], config.mockOrder[i]];
  renderMockOrder();
}
function mockRemove(id) { config.mockOrder = config.mockOrder.filter(x => x !== id); renderMockOrder(); }
function addTukaSeg() {
  if (!config.mockOrder.includes('tuka')) config.mockOrder.push('tuka');
  renderMockOrder();
}

function mockSetupSummary() {
  const totalMin = parseInt($('#mockTotal').value) || config.totalMinutes;
  const sumMin = config.mockOrder.reduce((a,id) => a + (secById(id)?.minutes || 0), 0);
  const sumQ = config.mockOrder.reduce((a,id) => a + (secById(id)?.count || 0), 0);
  $('#mockTotalSec').textContent = `= ${totalMin*60} 秒`;
  const diff = totalMin - sumMin;
  $('#mockSumPill').innerHTML = `板块合计 <b>${sumMin} 分 · ${sumQ} 题</b>`;
  if (diff > 0) $('#mockSumPill').innerHTML += ` · <span class="pill pill-ok">富余 ${diff} 分(机动)</span>`;
  else if (diff < 0) $('#mockSumPill').innerHTML += ` · <span class="pill pill-bad">超出 ${-diff} 分</span>`;
}

function startMock() {
  const totalMin = parseInt($('#mockTotal').value) || config.totalMinutes;
  const segs = config.mockOrder.map(id => {
    const s = secById(id);
    return { sectionId:id, questionCount:s.count, targetMs:s.minutes*60*1000, timeMs:0, correct:null };
  });
  if (!segs.length) { toast('请至少保留一个板块'); return; }
  session = {
    mode:'mock', segs, cur:0, totalTargetMs: totalMin*60*1000,
    totalTimer: new Timer(), segTimer: new Timer(),
    paused:false,
  };
  session.startAt = new Date().toISOString();
  session.totalTimer.start(); session.segTimer.start();
  go('mock-timer');
}

      <div class="timer-label" id="segLabel"></div>
      <div class="timer-num" id="bigNum"></div>

          </div>
          <div style="text-align:right">

function tickMockTimer() {
  const s = session; if (!s) return;
  const totalEl = s.totalTimer.elapsed();
  const totalRemaining = s.totalTargetMs - totalEl;
  const totalOver = totalRemaining <= 0;
  const seg = s.segs[s.cur];
  const segEl = s.segTimer.elapsed();
  const segOver = segEl > seg.targetMs;

  const big = $('#bigNum'); if (!big) return;
  big.textContent = fmtTime(totalOver ? totalEl : totalRemaining);
  big.className = 'timer-num' + (totalOver ? ' overdue' : '');
  $('#tMeta').innerHTML = totalOver ? `整卷已超时 <b>+${fmtTime(-totalRemaining)}</b>` : `整卷剩余 <b>${fmtTime(totalRemaining)}</b>`;
  $('#tProgressBar').style.width = Math.min(100, totalEl/s.totalTargetMs*100).toFixed(1) + '%';
  $('#tProgressBar').className = totalOver ? 'over' : '';
  $('#segLabel').textContent = `套卷 · 第 ${s.cur+1}/${s.segs.length} 板块`;
  $('#segName').innerHTML = `${esc(secName(seg.sectionId))} <span class="muted-3" style="font-size:13px;font-weight:400">${seg.questionCount} 题</span>`;
  $('#segTime').innerHTML = `<span style="${segOver?'color:var(--bad)':''}">${fmtTime(segEl)}</span> <span class="muted-3" style="font-size:12px;font-weight:400">/ ${fmtTime(seg.targetMs)}</span>`;
  $('#segWarn').innerHTML = segOver ? `<span class="pill pill-bad">本板块已超参考时间</span>` : '';
  $('#pauseBtn').textContent = s.paused ? '继续' : '暂停';

  $('#segList').innerHTML = s.segs.map((g, i) => {
    let cls = '';
    if (i < s.cur) cls = 'done';
    else if (i === s.cur) cls = 'cur';
    const mark = i < s.cur ? '✓' : (i === s.cur ? '▶' : (i+1));
    const t = i < s.cur ? fmtTime(g.timeMs) : (i === s.cur ? fmtTime(segEl) : fmtTime(g.targetMs));
    return `<div class="seg-item ${cls}">
      <span class="gi">${mark}</span>
      <span class="nm">${esc(secName(g.sectionId))}</span>
      <span class="tm">${t}</span>
    </div>`;
  }).join('');
}

function mockNextSeg() {
  const s = session;
  // 结算当前段
  s.segs[s.cur].timeMs = Math.round(s.segTimer.elapsed());
  s.cur++;
  if (s.cur >= s.segs.length) { finishMock(); return; }
  s.segTimer = new Timer(); s.segTimer.start();
  render();
}

function finishMock() {
  const s = session;
  // 结算当前段(若尚未结算)
  const cur = s.segs[s.cur];
  if (cur && !cur.timeMs) cur.timeMs = Math.round(s.segTimer.elapsed());
  s.totalTimer.pause(); s.segTimer.pause();
  s.totalMs = s.totalTimer.elapsed();
  s.endAt = new Date().toISOString();
  go('mock-finish');
}

function renderMockFinish(app) {
  const s = session;
  const rows = s.segs.map((g, i) => {
    const ref = g.targetMs;
    const diff = g.timeMs - ref;
    const isTuka = g.questionCount <= 0;
    return `<div class="finish-seg">
      <div class="nm">${esc(secName(g.sectionId))}
        <div class="meta">${isTuka ? '涂卡' : g.questionCount+' 题'} · 用时 ${fmtTime(g.timeMs)} · 参考 ${fmtTime(ref)} · ${diff>0?'超 '+fmtTime(diff):'余 '+fmtTime(-diff)}</div></div>
      ${isTuka ? '<div class="muted-3" style="font-size:13px;text-align:right">—</div>' : `<input type="number" placeholder="做对 ${g.questionCount} 题" min="0" max="${g.questionCount}" onchange="mockSegCorrect(${i},this.value)">`}
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="hero" style="padding-bottom:16px">
      <div class="row mb-8"><button class="btn-ghost btn-sm" onclick="go('home')">← 返回</button></div>
      <h1>套卷完成</h1>
      <div class="sub">整卷用时 ${fmtTime(s.totalMs)} · 目标 ${fmtTime(s.totalTargetMs)} · ${s.totalMs>s.totalTargetMs?'超时 '+fmtTime(s.totalMs-s.totalTargetMs):'富余 '+fmtTime(s.totalTargetMs-s.totalMs)}</div>
    </div>

    <div class="card card-pad mb-16">
      <div class="section-title mb-16">各板块正确率(可空)</div>
      ${rows}
    </div>

    <button class="btn btn-primary btn-block" onclick="saveMock()">保存记录</button>`;
}

function mockSegCorrect(i, v) {
  const g = session.segs[i];
  let c = parseInt(v);
  if (!isNaN(c)) c = Math.max(0, Math.min(c, g.questionCount));
  g.correct = (!isNaN(c) && c >= 0) ? c : null;
}

function saveMock() {
  const s = session;
  const before = unlockedSet();
  records.push({
    id: uid(), type:'mock', date: new Date().toISOString(),
    startAt: s.startAt || null, endAt: s.endAt || null,
    timeMs: Math.round(s.totalMs), targetMs: Math.round(s.totalTargetMs),
    segments: s.segs.map(g => ({
      sectionId: g.sectionId, questionCount: g.questionCount,
      timeMs: g.timeMs, targetMs: g.targetMs, correct: g.correct != null ? g.correct : null,
    })),
  });
  saveRecords();
  const newly = newlyUnlocked(before);
  toast(newly.length
    ? `已保存 · 解锁「${newly[0].name}」${newly.length > 1 ? ` 等 ${newly.length} 个成就` : ''}`
    : '已保存');
  session = null;
  go('home');
}

/* =====================================================================
 * 设置
 * =================================================================== */
function renderSettings(app) {
  const rows = config.sections.map((s, i) => `
    <div class="seg-input" data-id="${s.id}">
      <div class="nm"><input type="text" value="${esc(s.name)}" onchange="cfgName('${s.id}',this.value)"></div>
      <input type="number" class="hide-sm" value="${s.count}" min="${s.isTuka?0:1}" onchange="cfgCount('${s.id}',this.value)" title="题量">
      <input type="number" value="${s.minutes}" min="0" onchange="cfgMin('${s.id}',this.value)" title="目标分钟">
      <span class="muted-3" style="font-size:12px">${s.count>0 ? (s.minutes*60/s.count).toFixed(0)+'s/题' : '—'}</span>
    </div>`).join('');

  const subTypeRows = config.sections.filter(s => s.subTypes.length || !s.isTuka).map(s => `
    <div class="mb-16">
      <label class="fl">${esc(s.name)} · 二级题型</label>
      <input type="text" value="${esc(s.subTypes.join('、'))}" placeholder="用顿号、分隔,留空则不分"
        onchange="cfgSubTypes('${s.id}',this.value)">
    </div>`).join('');

  app.innerHTML = `
    <div class="hero" style="padding-bottom:16px">
      <div class="row mb-8"><button class="btn-ghost btn-sm" onclick="go('home')">← 返回</button></div>
      <h1>设置</h1>
      <div class="sub">所有时间、题量、板块均可自定义</div>
    </div>

    <div class="card card-pad mb-16">
      <div class="section-title mb-16">板块 · 题量 · 目标时间</div>
      <div class="mb-8" style="display:grid;grid-template-columns:1fr 96px 96px 60px;gap:8px;font-size:11px;color:var(--text-3)" id="cfgHead">
        <span>板块</span><span class="hide-sm">题量</span><span>分钟</span><span>均速</span>
      </div>
      ${rows}
    </div>

    <div class="card card-pad mb-16">
      <div class="section-title mb-16">二级题型</div>
      ${subTypeRows}
    </div>

    <div class="card card-pad mb-16">
      <div class="section-title mb-16">诊断参数</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div><label class="fl">目标正确率(%)</label>
          <input type="number" id="targetAcc" value="${config.targetAccuracy}" min="0" max="100"></div>
        <div><label class="fl">套卷总时长(分钟)</label>
          <input type="number" id="totalMinutes" value="${config.totalMinutes}" min="1"></div>
        <div style="grid-column:1/-1"><label class="fl">错因选项(顿号分隔)</label>
          <input type="text" id="errTypes" value="${esc(config.errorTypes.join('、'))}"></div>
      </div>
    </div>

    <div class="card card-pad mb-16">
      <div class="section-title mb-16">计划与目标</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div><label class="fl">考试名称</label>
          <input type="text" id="examName" value="${esc(config.examName || '')}" placeholder="2027 国考"></div>
        <div><label class="fl">考试日期</label>
          <input type="date" id="examDate" value="${esc(config.examDate || '')}"></div>
        <div><label class="fl">每周目标天数(0-7)</label>
          <input type="number" id="weeklyGoalDays" value="${config.weeklyGoalDays || 0}" min="0" max="7"></div>
      </div>
      <div class="muted-3 mt-8" style="font-size:12px">首页「今日计划」是每天可增删改的清单,勾选即完成;倒计时按这里的考试日期计算。</div>
    </div>

    <div class="row gap-8">
      <button class="btn btn-primary" style="flex:1" onclick="saveSettings()">保存设置</button>
      <button class="btn" onclick="resetConfig()">恢复默认</button>
    </div>`;
}

function cfgName(id, v) { const s = secById(id); if (s) s.name = v.trim() || s.name; }
function cfgCount(id, v) { const s = secById(id); if (s) s.count = Math.max(s.isTuka?0:1, parseInt(v)||0); }
function cfgMin(id, v) { const s = secById(id); if (s) s.minutes = Math.max(0, parseInt(v)||0); }
function cfgSubTypes(id, v) {
  const s = secById(id); if (!s) return;
  s.subTypes = v.split(/[、,，]/).map(x => x.trim()).filter(Boolean);
}

function saveSettings() {
  const acc = parseInt($('#targetAcc').value);
  if (!isNaN(acc) && acc >= 0 && acc <= 100) config.targetAccuracy = acc;
  const et = $('#errTypes').value.split(/[、,，]/).map(x => x.trim()).filter(Boolean);
  if (et.length) config.errorTypes = et;
  const tm = parseInt($('#totalMinutes').value);
  if (!isNaN(tm) && tm > 0) config.totalMinutes = tm;

  const en = $('#examName').value.trim();
  if (en) config.examName = en;
  const ed = $('#examDate').value;
  if (ed) config.examDate = ed;
  const wg = parseInt($('#weeklyGoalDays').value);
  if (!isNaN(wg) && wg >= 0 && wg <= 7) config.weeklyGoalDays = wg;

  // 同步 mockOrder 中可能被删的板块
  config.mockOrder = config.mockOrder.filter(id => secById(id));
  saveConfig();
  toast('已保存');
  go('home');
}
function resetConfig() {
  if (!confirm('恢复默认设置?将清空你自定义的板块/时间/题量。')) return;
  config = structuredClone(DEFAULT_CONFIG);
  saveConfig();
  go('settings');
}

/* =====================================================================
 * 导出 / 导入
 * =================================================================== */
function exportData() {
  const payload = {
    app: 'xctimer', version: 1, exportedAt: new Date().toISOString(),
    config, records,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `行测计时器备份_${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('已导出 JSON');
}

function importData(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.records)) { toast('文件格式不正确'); return; }
      // 合并记录(按 id 去重),恢复配置
      const existing = new Set(records.map(r => r.id));
      let added = 0;
      for (const r of data.records) if (!existing.has(r.id)) { records.push(r); added++; }
      if (data.config) config = Object.assign(structuredClone(DEFAULT_CONFIG), data.config);
      saveRecords(); saveConfig();
      toast(`导入完成,新增 ${added} 条记录`);
      go('home');
    } catch (e) { toast('导入失败:' + e.message); }
  };
  reader.readAsText(file);
  input.value = '';
}

/* =====================================================================
 * 启动
 * =================================================================== */
render();
</script>
</body>
</html>
