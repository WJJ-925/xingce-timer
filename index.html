  if (statsViewMode==='byExam') {
    let examRows='';for(const[eid,exm]of Object.entries(config.exams)){const eRecs=records.filter(r=>(r.examId||'guokao')===eid),agg=aggregate(eRecs);if(!agg.count)continue;examRows+=`<tr><td><span class="row gap-8" style="gap:7px"><span class="exam-dot" style="background:${esc(exm.theme||'#4f46e5')};box-shadow:0 0 0 3px var(--accent-soft)"></span>${esc(exm.name)}</span></td><td class="num">${agg.count}</td><td class="num">${fmtMinSec(agg.totalMs)}</td><td class="num">${agg.totalQ}</td><td class="num">${accCell(agg)}</td></tr>`;}
    app.innerHTML=`<div class="hero" style="padding-bottom:16px"><div class="row mb-8"><button class="btn-ghost btn-sm" onclick="go('home')">← 返回</button></div><h1>统计</h1><div class="sub">各考试数据对比</div></div>${modeTabs}<div class="card card-pad mb-16"><div class="section-title mb-16">${ico('stats', 14)}各考试对比</div>${examRows?`<div style="overflow-x:auto"><table class="diag"><thead><tr><th>考试</th><th class="num">组数</th><th class="num">总时长</th><th class="num">总题量</th><th class="num">正确率</th></tr></thead><tbody>${examRows}</tbody></table></div>`:`<div class="empty" style="padding:24px">还没有练习记录</div>`}</div>${renderHeatmap()}${renderAchievements()}`;
    return;
  }

  app.innerHTML=`<div class="hero" style="padding-bottom:16px"><div class="row mb-8"><button class="btn-ghost btn-sm" onclick="go('home')">← 返回</button></div><h1>统计</h1><div class="sub">${esc(exam.name)} · 当天汇总与累计计时</div></div>${modeTabs}<div class="card card-pad mb-16"><div class="section-title mb-16">${ico('stats', 14)}今天 · ${esc(todayKey())}</div>${today.count?`<div class="stat-grid">${statCell(today.count,'练习组数','int')}${statCell(today.totalMs,'总时长','ms')}${statCell(today.totalQ,'总题量','int')}${statCell(accPct(today)||0,'正确率','pct')}</div>${today.total?`<div class="muted mt-8" style="font-size:12.5px">做对 ${today.correct} / ${today.total} 题</div>`:''}${secRows?`<div style="overflow-x:auto"><table class="diag mt-16"><thead><tr><th>板块</th><th class="num">用时</th><th class="num">题量</th><th class="num">做对</th><th class="num">正确率</th></tr></thead><tbody>${secRows}</tbody></table></div>`:''}`:`<div class="empty" style="padding:24px">今天还没有练习</div>`}</div><div class="card card-pad mb-16"><div class="section-title mb-16">${ico('flame', 14)}累计</div>${all.count?`<div class="stat-grid">${statCell(all.count,'总组数','int')}${statCell(all.totalMs,'总时长','ms')}${statCell(all.totalQ,'总题量','int')}${statCell(accPct(all)||0,'总正确率','pct')}${statCell(days,'练习天数','int')}${statCell(avgMs,'平均每次','ms')}</div>${all.total?`<div class="muted mt-8" style="font-size:12.5px">累计做对 ${all.correct} / ${all.total} 题</div>`:''}${rangeHtml}`:`<div class="empty" style="padding:24px">还没有练习记录</div>`}</div>${renderHeatmap()}${renderAchievements()}`;
}

/* =====================================================================
 * 专项练习
 * =================================================================== */
let randPool = null;        // null = 全部板块;否则为勾选的 id 数组
let drawnId = null;         // 当前抽中的板块
let drawnExamId = null;     // 抽中时所属考试(切换考试后清理卡面)
let drawnRevealed = false;  // 卡牌是否已翻开(重渲染时保持翻面状态)
let lastRenderedView = null; // 上次渲染的视图(仅视图切换时播过渡动画)

/* ----- 板块专属卡面图(每个板块单独上传/保存) ----- */
const LS_CARDS = 'xctimer_cardfaces_v1';   // { "考试id:板块id": dataURL }
const LS_CARD_LEGACY = 'xctimer_cardface_v1'; // v2.4 全局单图,启动时迁移
let cardFaces = {};
function cardKey(examId, secId) { return examId + ':' + secId; }
function getCardFace(examId, secId) { return cardFaces[cardKey(examId, secId)] || null; }
function saveCardFaces() { localStorage.setItem(LS_CARDS, JSON.stringify(cardFaces)); }
function loadCardFaces() {
  try { cardFaces = JSON.parse(localStorage.getItem(LS_CARDS)) || {}; } catch (e) { cardFaces = {}; }
  // 迁移旧版全局卡面图 → 当前考试每个板块
  try {
    const legacy = localStorage.getItem(LS_CARD_LEGACY);
    if (legacy && Object.keys(cardFaces).length === 0 && config && config.exams) {
      const eid = config.activeExamId;
      (config.exams[eid].sections || []).filter(s => !s.isTuka).forEach(s => {
        cardFaces[cardKey(eid, s.id)] = legacy;
      });
      saveCardFaces();
    }
    localStorage.removeItem(LS_CARD_LEGACY);
  } catch (e) {}
}
function cardFacePick() {
  const f = document.getElementById('cardFaceFile');
  if (f) { f.value = ''; f.click(); }
}
function setCardFace(file) {
  if (!drawnId) { toast('先抽一张卡,再为该板块上传图'); return; }
  if (!file || !file.type || !file.type.startsWith('image/')) { toast('请选择图片文件'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      // 压缩至最大 640px 宽,控制 localStorage 体积
      const maxW = 640;
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const data = canvas.toDataURL('image/jpeg', 0.85);
      try {
        cardFaces[cardKey(activeExamId(), drawnId)] = data;
        saveCardFaces();
        toast(`「${secName(drawnId)}」卡面已保存`);
        render();
      } catch (e) { toast('图片太大保存失败,换小一点的试试'); }
    };
    img.onerror = () => toast('图片读取失败');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function clearCardFaceFor() {
  if (!drawnId) return;
  delete cardFaces[cardKey(activeExamId(), drawnId)];
  saveCardFaces();
  toast(`已恢复「${secName(drawnId)}」默认卡面`);
  render();
}

function poolIds() {
  const all = activeExam().sections.filter(s=>!s.isTuka).map(s=>s.id);
  return randPool == null ? all : all.filter(id => randPool.includes(id));
}
function toggleRandPool(id) {
  const all = activeExam().sections.filter(s=>!s.isTuka).map(s=>s.id);
  if (randPool == null) randPool = all.slice();
  const i = randPool.indexOf(id);
  if (i >= 0) {
    if (randPool.length <= 1) { toast('至少保留一个板块'); return; }
    randPool.splice(i, 1);
  } else randPool.push(id);
  render();
}
function resetRandPool() { randPool = null; render(); }
function lastPracticedSectionId() {
  const er = examRecords().filter(r => r.type === 'section');
  if (!er.length) return null;
  return er.slice().sort((a,b)=>b.date.localeCompare(a.date))[0].sectionId;
}
/* ----- 抽卡 ----- */
function drawRandomCard() {
  const ids = poolIds();
  if (!ids.length) { toast('请先勾选板块'); return; }
  let pool = ids;
  if (ids.length > 1) {
    const excl = new Set();
    const last = lastPracticedSectionId();
    if (last && ids.includes(last)) excl.add(last);          // 避开最近练过的
    if (drawnId && ids.includes(drawnId)) excl.add(drawnId); // 换一张时保证换板块
    const filtered = ids.filter(x => !excl.has(x));
    if (filtered.length) pool = filtered;
  }
  drawnId = pool[Math.floor(Math.random() * pool.length)];
  drawnExamId = activeExamId();
  drawnRevealed = false;
  render();
  const card = document.getElementById('drawCard');
  if (card) setTimeout(() => { card.classList.add('flip'); drawnRevealed = true; }, 480);
}
function drawGo() {
  if (!drawnId) return;
  pickSection(drawnId);
  toast(`开练 · ${secName(drawnId)}`);
}
function drawCardHtml(sec) {
  const pace = refPace(sec.id);
  const img = getCardFace(drawnExamId || activeExamId(), sec.id);
  const frontStyle = img ? ` style="background-image:url('${img}')"` : '';
  return `<div class="draw-card ${drawnRevealed ? 'flip' : ''}" id="drawCard">
    <div class="draw-face draw-back"><div class="q">?</div><div class="bt">XINGCE · DRAW</div></div>
    <div class="draw-face draw-front ${img ? 'has-img' : ''}"${frontStyle}>
      ${img ? '' : `<div class="df-deco">${ico('target', 52)}</div>`}
      <div class="df-top">
        <div class="df-tag">随机抽中</div>
        <div class="df-name">${esc(sec.name)}</div>
        ${sec.subTypes && sec.subTypes.length ? `<div class="df-sub">${esc(sec.subTypes.join(' · '))}</div>` : ''}
      </div>
      <div class="df-bottom">
        <div class="df-rows">
          <span class="df-pill">${sec.count} 题</span>
          <span class="df-pill">参考 ${sec.minutes} 分</span>
          ${pace != null ? `<span class="df-pill">${pace.toFixed(0)}s/题</span>` : ''}
        </div>
        <div class="df-cta">点「开练」进入计时配置</div>
      </div>
    </div>
  </div>
  <div class="draw-actions">
    <button class="btn btn-primary" onclick="drawGo()">${ico('play', 15)}开练</button>
    <button class="btn" onclick="drawRandomCard()">${ico('dice', 15)}换一张</button>
  </div>
  <div class="draw-tools">
    <button class="btn-ghost btn-sm" onclick="cardFacePick()">${ico('upload', 13)}${img ? '更换本板块卡图' : '上传本板块卡图'}</button>
    ${img ? `<button class="btn-ghost btn-sm" onclick="clearCardFaceFor()">恢复默认</button>` : ''}
  </div>`;
}
function renderRandCard() {
  const exam = activeExam();
  const cur = poolIds();
  const chips = exam.sections.filter(s=>!s.isTuka).map(s=>{
    const on = cur.includes(s.id);
    return `<button class="chip ${on?'sel':''}" onclick="toggleRandPool('${s.id}')" title="${on?'移出随机池':'加入随机池'}">${esc(s.name)}</button>`;
  }).join('');
  const drawn = drawnId ? secById(drawnId) : null;
  return `<div class="card card-pad mb-16">
    <div class="section-title mb-16">${ico('dice', 14)}随机抽板块 · 治疗选择困难</div>
    <div class="chip-row">${chips}<button class="chip ${randPool==null?'sel':''}" onclick="resetRandPool()" title="恢复全部板块">全选</button></div>
    <button class="btn btn-primary btn-block mt-16" onclick="drawRandomCard()">${ico('dice', 15)}${drawn ? '再抽一张' : '抽一张'}</button>
    <div class="rand-hint">从勾选板块里随机,自动避开最近练过的;每个板块可单独上传专属卡面图</div>
    <input type="file" id="cardFaceFile" accept="image/*" class="sr-file" onchange="setCardFace(this.files[0]);this.value=''">
    ${drawn ? `<div class="draw-stage show">${drawCardHtml(drawn)}</div>` : ''}
  </div>`;
}

function renderSectionSetup(app) {
  const exam=activeExam();
  if(!session||session.mode!=='section'){const first=exam.sections.find(s=>!s.isTuka);session={mode:'section',sectionId:first?first.id:exam.sections[0].id,subType:null,questionCount:first?first.count:0,timeMode:'countup'};}
  const opts=exam.sections.filter(s=>!s.isTuka).map(s=>`<button class="opt ${session&&session.sectionId===s.id?'sel':''}" onclick="pickSection('${s.id}')"><div class="t">${esc(s.name)}</div><div class="s">${s.count}题 · ${s.minutes}分${s.subTypes.length?' · 可细分':''}</div></button>`).join('');
  app.innerHTML=`<div class="hero" style="padding-bottom:16px"><div class="row mb-8"><button class="btn-ghost btn-sm" onclick="go('home')">← 返回</button></div><h1>专项练习</h1><div class="sub">${esc(exam.name)} · 选板块、填题量,开表计时</div></div><div class="card card-pad mb-16"><div class="section-title mb-16">${ico('target', 14)}1 · 选择板块</div><div class="opt-grid">${opts}</div><div id="subTypeRow" class="mt-16 hidden"><label class="fl">二级题型(可选,留空=整个板块)</label><div class="chip-row" id="subTypeChips"></div></div></div><div class="card card-pad mb-16"><div class="section-title mb-16">${ico('logo', 14)}2 · 题量与计时</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div><label class="fl">题量</label><input type="number" id="qCount" min="1" value="${session?.questionCount||(session?.sectionId?secById(session.sectionId).count:20)}" oninput="setupPreview()"></div><div><label class="fl">计时方式</label><select id="timeMode" onchange="setupPreview()"><option value="countup" ${!session||session.timeMode!=='countdown'?'selected':''}>正计时(不限时)</option><option value="countdown" ${session&&session.timeMode==='countdown'?'selected':''}>倒计时(限时)</option></select></div></div><div id="targetWrap" class="mt-16 hidden"><label class="fl">目标时间</label><input type="number" id="targetMin" min="1" step="1" value="10" oninput="setupPreview()"></div><div class="mt-16" id="setupPreviewBox"></div></div><button class="btn btn-primary btn-block" id="startBtn" onclick="startSection()">${ico('play', 15)}开始计时</button>`;
  renderSubTypes();setupPreview();
}
function pickSection(id){const s=secById(id);session={mode:'section',sectionId:id,subType:null,questionCount:s?s.count:0,timeMode:'countup'};go('section-setup');}
function renderSubTypes(){if(!session)return;const sec=secById(session.sectionId),row=$('#subTypeRow'),chips=$('#subTypeChips');if(!sec||!sec.subTypes.length){row.classList.add('hidden');return;}row.classList.remove('hidden');chips.innerHTML=sec.subTypes.map(st=>`<button class="chip ${session.subType===st?'sel':''}" onclick="pickSubType('${esc(st)}')">${esc(st)}</button>`).join('');}
function pickSubType(st){if(session){session.subType=session.subType===st?null:st;renderSubTypes();}}
function setupPreview(){if(!session)return;const q=parseInt($('#qCount').value)||0,mode=$('#timeMode').value;session.questionCount=q;session.timeMode=mode;const targetWrap=$('#targetWrap');if(mode==='countdown'){targetWrap.classList.remove('hidden');const defMin=refTimeFor(session.sectionId,q)/60000;$('#targetMin').value=Math.max(1,Math.round(defMin));}else targetWrap.classList.add('hidden');const refMs=refTimeFor(session.sectionId,q),box=$('#setupPreviewBox');if(q>0)box.innerHTML=`<div class="row gap-8" style="font-size:13px;color:var(--text-2)"><span class="pill pill-gray">${esc(secName(session.sectionId))}${session.subType?' · '+esc(session.subType):''}</span><span>参考时间 <b style="color:var(--text)">${fmtTime(refMs)}</b></span>${refPace(session.sectionId)!=null?`<span>参考均速 <b style="color:var(--text)">${refPace(session.sectionId).toFixed(0)}s/题</b></span>`:''}</div>`;else box.innerHTML='';}
function startSection(){if(!session||!session.sectionId){toast('请先选择板块');return;}const q=parseInt($('#qCount').value)||0;if(q<=0){toast('题量需大于0');return;}session.questionCount=q;session.timeMode=$('#timeMode').value;session.targetMs=session.timeMode==='countdown'?Math.round(parseFloat($('#targetMin').value||'0')*60*1000):refTimeFor(session.sectionId,q);session.startAt=new Date().toISOString();session.timer=new Timer();session.timer.start();session.paused=false;session.done=false;go('section-timer');}

function renderSectionTimer(app){
  const s=session,sec=secById(s.sectionId);
  app.innerHTML=`
  <div class="timer-stage">
    <div class="timer-glow" id="timerGlow"></div>
    <div class="timer-chip">${esc(sec.name)}${s.subType?' · '+esc(s.subType):''} · ${s.questionCount} 题</div>
    <div class="timer-num" id="bigNum"></div>
    <div class="timer-meta" id="tMeta"></div>
    <div class="progress hidden" id="tProgress"><i id="tProgressBar"></i></div>
    <div class="timer-btns">
      <button class="btn" onclick="togglePause()" id="pauseBtn"></button>
      <button class="btn btn-primary" onclick="finishSection()">结束</button>
    </div>
  </div>`;

}
function tickSectionTimer(){
  const s=session;if(!s)return;
  const el=s.timer.elapsed(),mode=s.timeMode,remaining=mode==='countdown'?s.targetMs-el:null,overdue=remaining!=null&&remaining<=0,overRef=el>refTimeFor(s.sectionId,s.questionCount);
  const big=$('#bigNum');if(!big)return;
  big.textContent=fmtTime(overdue?el:(remaining!=null?remaining:el));
  big.className='timer-num'+(overdue?' overdue':'');
  const glow=$('#timerGlow');if(glow)glow.className='timer-glow'+(overdue?' over':'');
  $('#pauseBtn').textContent=s.paused?'继续':'暂停';
  let meta;
  if(mode==='countdown')meta=overdue?`已超时 <b>+${fmtTime(el-s.targetMs)}</b>`:`剩余目标 <b>${fmtTime(remaining)}</b>`;
  else meta=`已用 <b>${fmtTime(el)}</b> · 参考 <b>${fmtTime(refTimeFor(s.sectionId,s.questionCount))}</b>`+(overRef?' <span class="pill pill-warn">超过参考时间</span>':'');
  $('#tMeta').innerHTML=meta;
  const prog=$('#tProgress');
  if(mode==='countdown'){prog.classList.remove('hidden');const bar=$('#tProgressBar');bar.style.width=Math.min(100,el/s.targetMs*100).toFixed(1)+'%';bar.className=overdue?'over':'';}
  else prog.classList.add('hidden');
}

function togglePause(){
  if(!session)return;
  if(session.paused){
    if(session.mode==='mock'){session.totalTimer.start();session.segTimer.start();}
    else session.timer.start();
    session.paused=false;
  }else{
    if(session.mode==='mock'){session.totalTimer.pause();session.segTimer.pause();}
    else session.timer.pause();
    session.paused=true;
  }
  const btn=$('#pauseBtn');if(btn)btn.textContent=session.paused?'继续':'暂停';
  onTick();
}
function finishSection(){session.timer.pause();session.timeMs=session.timer.elapsed();session.endAt=new Date().toISOString();session.correct=null;session.errorType=[];session.note='';go('section-finish');}

function mockSegCount(id,v){const s=secById(id);if(s)s.count=Math.max(s.isTuka?0:1,parseInt(v)||0);}
function mockSegMin(id,v){const s=secById(id);if(s)s.minutes=Math.max(0,parseInt(v)||0);}
function mockMove(id,dir){const exam=activeExam(),i=exam.mockOrder.indexOf(id),j=i+dir;if(j<0||j>=exam.mockOrder.length)return;[exam.mockOrder[i],exam.mockOrder[j]]=[exam.mockOrder[j],exam.mockOrder[i]];renderMockOrder();}
function mockRemove(id){const exam=activeExam();exam.mockOrder=exam.mockOrder.filter(x=>x!==id);renderMockOrder();}
function addTukaSeg(){const exam=activeExam();if(!exam.mockOrder.includes('tuka'))exam.mockOrder.push('tuka');renderMockOrder();}
function mockSetupSummary(){const exam=activeExam(),totalMin=parseInt($('#mockTotal').value)||exam.totalMinutes,sumMin=exam.mockOrder.reduce((a,id)=>a+(secById(id)?.minutes||0),0),sumQ=exam.mockOrder.reduce((a,id)=>a+(secById(id)?.count||0),0);$('#mockTotalSec').textContent=`= ${totalMin*60} 秒`;const diff=totalMin-sumMin;$('#mockSumPill').innerHTML=`板块合计 <b>${sumMin} 分 · ${sumQ} 题</b>`;if(diff>0)$('#mockSumPill').innerHTML+=` · <span class="pill pill-ok">富余 ${diff} 分(机动)</span>`;else if(diff<0)$('#mockSumPill').innerHTML+=` · <span class="pill pill-bad">超出 ${-diff} 分</span>`;}
function startMock(){const exam=activeExam(),totalMin=parseInt($('#mockTotal').value)||exam.totalMinutes,segs=exam.mockOrder.map(id=>{const s=secById(id);return{sectionId:id,questionCount:s.count,targetMs:s.minutes*60*1000,timeMs:0,correct:null};});if(!segs.length){toast('请至少保留一个板块');return;}session={mode:'mock',segs,cur:0,totalTargetMs:totalMin*60*1000,totalTimer:new Timer(),segTimer:new Timer(),paused:false};session.startAt=new Date().toISOString();session.totalTimer.start();session.segTimer.start();go('mock-timer');}

function renderMockTimer(app){
  const s=session,isLast=s.cur===s.segs.length-1;
  app.innerHTML=`
  <div class="timer-stage">
    <div class="timer-glow" id="timerGlow"></div>
    <div class="timer-chip" id="segLabel"></div>

      <div class="row" style="justify-content:space-between;padding:0 2px">
        <div>
          <div style="font-size:12.5px;color:var(--text-2)">当前板块</div>

          <div style="font-size:12.5px;color:var(--text-2)">本板块用时</div>

  <div class="seg-list" id="segList">${buildSegListHtml()}</div>`;

function buildSegListHtml() {
  const s = session;
  return s.segs.map((g,i)=>{
    const isCur = i === s.cur;
    const visited = g.timeMs > 0;
    const cls = isCur ? 'cur' : (visited ? 'done' : '');
    const mark = isCur ? '▶' : (visited ? '✓' : (i+1));
    const t = isCur ? '0:00' : (g.timeMs ? fmtTime(g.timeMs) : fmtTime(g.targetMs));
    return `<div class="seg-item ${cls}" onclick="mockJumpSeg(${i})" title="点击切换到此板块"><span class="gi">${mark}</span><span class="nm">${esc(secName(g.sectionId))}</span><span class="tm">${isCur ? `<span id="segCurTime">${t}</span>` : t}</span></div>`;
  }).join('');
}
function tickMockTimer(){
  const s=session;if(!s)return;
  const totalEl=s.totalTimer.elapsed(),totalRemaining=s.totalTargetMs-totalEl,totalOver=totalRemaining<=0,seg=s.segs[s.cur],segEl=s.segTimer.elapsed(),segOver=segEl>seg.targetMs;
  const big=$('#bigNum');if(!big)return;
  big.textContent=fmtTime(totalOver?totalEl:totalRemaining);
  big.className='timer-num'+(totalOver?' overdue':'');
  const glow=$('#timerGlow');if(glow)glow.className='timer-glow'+(totalOver?' over':'');
  $('#tMeta').innerHTML=totalOver?`整卷已超时 <b>+${fmtTime(-totalRemaining)}</b>`:`整卷剩余 <b>${fmtTime(totalRemaining)}</b>`;
  const bar=$('#tProgressBar');
  bar.style.width=Math.min(100,totalEl/s.totalTargetMs*100).toFixed(1)+'%';
  bar.className=totalOver?'over':'';
  $('#segLabel').textContent=`套卷 · 第 ${s.cur+1}/${s.segs.length} 板块`;
  $('#segName').innerHTML=`${esc(secName(seg.sectionId))} <span class="muted-3" style="font-size:13px;font-weight:400">${seg.questionCount} 题</span>`;
  $('#segTime').innerHTML=`<span style="${segOver?'color:var(--bad)':''}">${fmtTime(segEl)}</span> <span class="muted-3" style="font-size:12px;font-weight:400">/ ${fmtTime(seg.targetMs)}</span>`;
  $('#segWarn').innerHTML=segOver?`<span class="pill pill-bad">本板块已超参考时间</span>`:'';
  $('#pauseBtn').textContent=s.paused?'继续':'暂停';
  // 分段列表结构仅在切换时重建(render);tick 只刷新当前段时间,避免高频 DOM 重建
  const curTimeEl = document.getElementById('segCurTime');
  if (curTimeEl) curTimeEl.textContent = fmtTime(segEl);
}
function mockJumpSeg(i){
  const s=session;
  if(!s||i===s.cur||i<0||i>=s.segs.length)return;
  // 结算当前段
  s.segs[s.cur].timeMs=Math.round(s.segTimer.elapsed());
  s.cur=i;
  // 回头补题:该段已有用时则继续累计
  s.segTimer=new Timer();
  const seed=s.segs[i].timeMs||0;
  if(seed>0)s.segTimer.acc=seed;
  s.segTimer.start();
  render();
}
function mockNextSeg(){
  const s=session;
  s.segs[s.cur].timeMs=Math.round(s.segTimer.elapsed());
  s.cur++;
  if(s.cur>=s.segs.length){finishMock();return;}
  s.segTimer=new Timer();
  const seed=s.segs[s.cur].timeMs||0;
  if(seed>0)s.segTimer.acc=seed;
  s.segTimer.start();
  render();
}
function finishMock(){const s=session,cur=s.segs[s.cur];if(cur&&!cur.timeMs)cur.timeMs=Math.round(s.segTimer.elapsed());s.totalTimer.pause();s.segTimer.pause();s.totalMs=s.totalTimer.elapsed();s.endAt=new Date().toISOString();go('mock-finish');}
function renderMockFinish(app){

}
function mockSegCorrect(i,v){const g=session.segs[i];let c=parseInt(v);if(!isNaN(c))c=Math.max(0,Math.min(c,g.questionCount));g.correct=(!isNaN(c)&&c>=0)?c:null;}
function saveMock(){
  const s=session,before=unlockedSet();
  records.push({id:uid(),type:'mock',date:new Date().toISOString(),examId:activeExamId(),startAt:s.startAt||null,endAt:s.endAt||null,timeMs:Math.round(s.totalMs),targetMs:Math.round(s.totalTargetMs),segments:s.segs.map(g=>({sectionId:g.sectionId,questionCount:g.questionCount,timeMs:g.timeMs,targetMs:g.targetMs,correct:g.correct!=null?g.correct:null}))});

function cfgName(id,v){const s=secById(id);if(s)s.name=v.trim()||s.name;}
function cfgCount(id,v){const s=secById(id);if(s)s.count=Math.max(s.isTuka?0:1,parseInt(v)||0);}
function cfgMin(id,v){const s=secById(id);if(s)s.minutes=Math.max(0,parseInt(v)||0);}
function cfgSubTypes(id,v){const s=secById(id);if(!s)return;s.subTypes=v.split(/[、,，]/).map(x=>x.trim()).filter(Boolean);}
function addSection(){const exam=activeExam(),name=($('#newSecName').value||'').trim();if(!name){toast('请输入板块名称');return;}const count=parseInt($('#newSecCount').value)||0,minutes=parseInt($('#newSecMin').value)||0,subRaw=($('#newSecSub').value||'').trim(),id='sec_'+Date.now().toString(36);exam.sections.push({id,name,count,minutes,subTypes:subRaw?subRaw.split(/[、,，]/).map(x=>x.trim()).filter(Boolean):[],isTuka:count===0});if(!exam.mockOrder.includes(id))exam.mockOrder.push(id);saveConfig();go('settings');}
function renameCurrentExam(){const exam=activeExam(),v=($('#renameExam').value||'').trim();if(!v){toast('考试名称不能为空');return;}exam.name=v;saveConfig();go('settings');}
function resetCurrentExam(){
  const examId=activeExamId();
  if(EXAM_PRESETS[examId]){
    if(!confirm(`将「${activeExam().name}」恢复为预设默认配置？你的自定义设置将被覆盖。`))return;
    const theme=activeExam().theme;   // 保留用户选的主题色?不,恢复预设色
    config.exams[examId]=structuredClone(EXAM_PRESETS[examId]);
    saveConfig();applyExamTheme();toast('已恢复预设');
  }else{
    if(!confirm(`确定删除自定义考试「${activeExam().name}」？所有板块配置将丢失。`))return;
    delete config.exams[examId];
    config.activeExamId=Object.keys(config.exams)[0];
    saveConfig();applyExamTheme();toast('已删除');
  }
  go('home');
}
function saveSettings(){
  const exam=activeExam(),acc=parseInt($('#targetAcc').value);
  if(!isNaN(acc)&&acc>=0&&acc<=100)exam.targetAccuracy=acc;
  const tm=parseInt($('#totalMinutes').value);
  if(!isNaN(tm)&&tm>0)exam.totalMinutes=tm;
  const en=($('#examName').value||'').trim();
  exam.examName=en||exam.name;
  const ed=$('#examDate').value;
  if(ed!==undefined)exam.examDate=ed;
  const et=($('#errTypes').value||'').split(/[、,，]/).map(x=>x.trim()).filter(Boolean);
  if(et.length)config.errorTypes=et;
  const wg=parseInt($('#weeklyGoalDays').value);
  if(!isNaN(wg)&&wg>=0&&wg<=7)config.weeklyGoalDays=wg;
  exam.mockOrder=exam.mockOrder.filter(id=>secById(id));
  saveConfig();toast('已保存');go('home');
}

/* =====================================================================
 * 导出 / 导入

function toggleExportMenu() {
  const m = document.getElementById('exportMenu');
  if (!m) return;
  if (!m.classList.contains('show')) {
    m.innerHTML = `
      <button class="item" onclick="exportData('json')">${ico('download', 14)}<span class="lbl">JSON 备份(完整数据)</span></button>
      <button class="item" onclick="exportData('csv')">${ico('grid', 14)}<span class="lbl">CSV 记录表(Excel 分析)</span></button>`;
  }
  m.classList.toggle('show');
}
function closeExportMenu() {
  const m = document.getElementById('exportMenu');
  if (m) m.classList.remove('show');
}

function csvEsc(v) {
  v = (v == null ? '' : String(v));
  if (/[",\n\r]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
  return v;
}
function secNameById(id, examId) { const s = secById(id, examId); return s ? s.name : id; }
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function exportData(fmt) {
  closeExportMenu();
  if (fmt === 'csv') {
    const rows = [['日期','考试','类型','板块','二级题型','题量','做对','正确率(%)','用时(分)','错因','备注','分板块明细']];
    for (const r of records) {
      const exName = (examById(r.examId || 'guokao') || {}).name || '—';
      if (r.type === 'section') {
        const acc = r.correct != null && r.questionCount > 0 ? (r.correct / r.questionCount * 100).toFixed(0) : '';
        rows.push([
          fmtDate(r.startAt || r.date), exName, '专项',
          secNameById(r.sectionId, r.examId), r.subType || '',
          r.questionCount, r.correct != null ? r.correct : '', acc,
          (r.timeMs / 60000).toFixed(1),
          (r.errorType || []).join('、'), r.note || '', ''
        ]);
      } else {
        const sc = mockScore(r);
        const totalQ = (r.segments || []).reduce((a, g) => a + (g.questionCount || 0), 0);
        const acc = sc.total > 0 ? (sc.correct / sc.total * 100).toFixed(0) : '';
        const detail = (r.segments || []).map(g =>
          `${secNameById(g.sectionId, r.examId)}${g.questionCount > 0 && g.correct != null ? ' ' + g.correct + '/' + g.questionCount : ''}`
        ).join('；');
        rows.push([
          fmtDate(r.startAt || r.date), exName, '套卷',
          '整卷', '', sc.total > 0 ? sc.total : totalQ,
          sc.total > 0 ? sc.correct : '', acc,
          (r.timeMs / 60000).toFixed(1), '', '', detail
        ]);
      }
    }
    const csv = '\uFEFF' + rows.map(row => row.map(csvEsc).join(',')).join('\r\n');
    downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), `行测计时器记录_${todayKey()}.csv`);
    toast(`已导出 CSV · ${records.length} 条记录`);
    return;
  }
  const payload={app:'xctimer',version:2,exportedAt:new Date().toISOString(),config,records};
  downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),`行测计时器备份_${todayKey()}.json`);
  toast('已导出 JSON');
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data||!Array.isArray(data.records)){toast('文件格式不正确');return;}
      const existing=new Set(records.map(r=>r.id));
      let added=0;
      for(const r of data.records){
        if(!existing.has(r.id)){
          if(!r.examId)r.examId=activeExamId();
          records.push(r);added++;
        }
      }
      if(data.config){
        if(data.config.exams){
          let ci=0;
          for(const[eid,exm]of Object.entries(data.config.exams)){
            if(!config.exams[eid])config.exams[eid]=exm;
            if(!config.exams[eid].theme)
              config.exams[eid].theme=EXAM_PRESETS[eid]?EXAM_PRESETS[eid].theme:CUSTOM_THEMES[ci++%CUSTOM_THEMES.length];
          }
        }
        if(data.config.errorTypes)config.errorTypes=data.config.errorTypes;
        if(data.config.weeklyGoalDays!=null)config.weeklyGoalDays=data.config.weeklyGoalDays;
        if(data.config.activeExamId&&config.exams[data.config.activeExamId])config.activeExamId=data.config.activeExamId;
      }
      saveRecords();saveConfig();applyExamTheme();
      toast(`导入完成,新增 ${added} 条记录`);
      go('home');
    }catch(e){toast('导入失败:'+e.message);}
  };
  reader.readAsText(file);
  input.value='';
}
